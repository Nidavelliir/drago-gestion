<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Drago Gestion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Drago Gestion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=19">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=40">
<style>
:root{
  --bg:#1f3d24; --bg2:#14291a; --gold:#ffc23a; --gold2:#e8891c; --ink:#2a1a08; --txt:#fbeecb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;color:var(--txt);
  background:var(--bg) url("fond.webp") center top/cover no-repeat fixed;
  min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.page{display:none;min-height:100dvh;padding:20px 16px 32px;max-width:640px;margin:0 auto}
.page.on{display:flex;flex-direction:column}


/* ---- Accueil ---- */
#home{justify-content:center;gap:10px}
#refresh{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:5;width:64px;border:0;background:none;padding:0;cursor:pointer}
#refresh img,#newsBtn img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
#refresh:active{transform:scale(.92)}
#refresh.spin img{animation:spin .8s linear infinite}
#newsBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:8px;z-index:5;width:150px;border:0;background:none;padding:0;cursor:pointer}
#newsBtn:active{transform:scale(.94)}
#newsDot{display:none}
.maj{margin-bottom:14px}
.maj h3{margin:0 0 6px;color:var(--gold);font-size:17px}
.maj h3 small{color:var(--txt);opacity:.7;font-weight:400;font-size:13px;margin-left:6px}
.maj ul{margin:0;padding-left:20px;line-height:1.45}
@keyframes spin{to{transform:rotate(360deg)}}
.tile{border:0;background:none;padding:0;cursor:pointer;display:block;width:100%;
  transition:transform .12s ease,filter .12s ease}
.tile:active{transform:scale(.95);filter:brightness(1.12)}
.tile img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}

/* bouton provisoire en attendant les visuels */
.plate{
  aspect-ratio:1.5/1;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(#ffd45c,var(--gold2));border:4px solid #3a2208;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.45);
}
.plate span{background:#1a1208;color:#ffe08a;font-weight:800;font-size:clamp(11px,3.4vw,17px);max-width:92%;overflow-wrap:anywhere;
  padding:7px 8px;border-radius:10px;border:2px solid var(--gold);letter-spacing:0;text-transform:uppercase}

/* ---- Pages internes ---- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{border:3px solid #3a2208;border-radius:14px;background:linear-gradient(#ffd45c,var(--gold2));
  color:var(--ink);font-weight:800;font-size:22px;width:48px;height:48px;cursor:pointer;flex:none}
.back:active{transform:scale(.92)}
.top h2{margin:0;color:var(--gold);font-size:26px;text-shadow:0 2px 0 #7a3d06,0 0 10px rgba(0,0,0,.9),0 0 3px #000}
.card{background:rgba(22,30,14,.82);border:2px solid rgba(255,194,58,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:18px;padding:18px;line-height:1.45}
.card b{color:var(--gold)}
.muted{opacity:.75;font-size:14px}

/* ---- Gestion des parcs ---- */
.btn{display:block;width:100%;border:3px solid #3a2208;border-radius:16px;cursor:pointer;padding:14px 16px;
  background:linear-gradient(#ffd45c,var(--gold2));color:var(--ink);font-size:18px;font-weight:800;font-family:inherit;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 12px rgba(0,0,0,.45)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(22,30,14,.85);color:var(--txt);border-color:rgba(255,194,58,.6)}
.parcList{display:flex;flex-direction:column;gap:12px;margin-top:16px}
/* boutons image */
.imgBtn,.back.imgBack{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;height:auto;border-radius:0}
.imgBtn img,.imgBack img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.imgBtn:active,.imgBack:active{transform:scale(.97)}
.back.imgBack{margin:0 0 12px}
.imgBack img{width:100%}
/* plaque d'un parc (nom de guilde + nombre de dragodindes) */
.btn.parcBtn{position:relative;display:flex;align-items:center;gap:2%;width:100%;aspect-ratio:1100/181;padding:0 6% 0 18.5%;
  background:url("plaque_parc.webp") center/100% 100% no-repeat;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));
  font-family:inherit;text-align:left;cursor:pointer}
.parcBtn .nomG{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.08;overflow-wrap:anywhere;font-size:clamp(13px,4.1vw,22px);font-weight:900;color:#fff2b8;
  text-shadow:0 2px 0 #4a2306,0 0 3px #3a1a04,1px 1px 0 #3a1a04,-1px -1px 0 #3a1a04}
.parcBtn .sep{width:2px;align-self:stretch;margin:5.5% 0;background:#f5b72a;border-radius:2px;flex:none}
.parcBtn .plume{height:44%;width:auto;flex:none}
.parcBtn .nbG{flex:none;font-size:clamp(10px,3vw,15px);font-weight:800;color:#fff2b8;white-space:nowrap;text-shadow:0 2px 0 #4a2306,1px 1px 0 #3a1a04,-1px -1px 0 #3a1a04}
.parcBtn:active{transform:scale(.97)}
.oldParcBtn{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:20px;
  background:linear-gradient(#2b1d0c,#1a1208);color:#ffe08a;border:3px solid var(--gold)}
.parcBtn small{font-size:13px;font-weight:600;color:var(--txt);opacity:.8}
form.card{display:flex;flex-direction:column;gap:12px;margin-top:0}
.f label.t{display:block;font-weight:700;color:var(--gold);margin-bottom:5px;font-size:15px}
.f input[type=text],.f input[type=number]{width:100%;padding:11px 12px;border-radius:10px;border:2px solid rgba(255,194,58,.5);
  background:rgba(255,248,225,.95);color:#2a1a08;font-size:16px;font-family:inherit}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer;
  border:2px solid rgba(255,194,58,.5);background:rgba(255,255,255,.06);font-weight:700}
.choice input{accent-color:var(--gold2);width:18px;height:18px;margin:0}
.choice label:has(input:checked){background:rgba(255,194,58,.28);border-color:var(--gold)}
.formBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.empty{text-align:center}
/* cadre illustré (haut / milieu étiré / bas) */
#parcBody{container-type:inline-size}
.cadre{position:relative;min-height:60cqw;padding:6.8cqw 4.6cqw 21cqw;
  background:url("cadre_haut.webp") top/100% auto no-repeat,url("cadre_bas.webp") bottom/100% auto no-repeat,url("cadre_milieu.webp") top 10cqw left 0/100% calc(100% - 20cqw) no-repeat;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.cadreTitre{height:6cqw;margin-bottom:3cqw;padding:0 6%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(12px,3.7vw,18px);color:#ffe9a8;text-shadow:0 2px 0 #3a1a04,1px 1px 0 #2a1204,-1px -1px 0 #2a1204;white-space:nowrap}
.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dragos{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;white-space:nowrap}
.dragos th{background:linear-gradient(#4a2a0c,#2a1604);color:#ffd96a;text-align:center;padding:9px 10px;border-top:2px solid #e9b23a;border-bottom:2px solid #e9b23a;
  font-weight:800;text-shadow:0 2px 0 #1a0a00}
.dragos th:first-child{border-left:2px solid #e9b23a;border-radius:10px 0 0 10px}.dragos th:last-child{border-right:2px solid #e9b23a;border-radius:0 10px 10px 0}
.dragos td{padding:7px 8px;text-align:center;border-bottom:1px solid rgba(233,178,58,.35);font-weight:700;color:#fff3d6}
.dragos tbody tr:nth-child(odd) td{background:rgba(0,0,0,.18)}
.dragos td b{color:#fff3d6}
.numB.qte{border-radius:12px;min-width:38px;font-size:14px;background:radial-gradient(circle at 40% 35%,#2e7a2a,#0f3a12)}
.dragos tr.gRow td{background:rgba(255,200,60,.08)!important;border-bottom:2px solid rgba(233,178,58,.55)}
.dragos tr.subRow td{background:rgba(0,0,0,.28)!important;font-size:13px;padding:5px 8px}
.dragos tr.subRow .numB{min-width:24px;height:24px;font-size:11px}
.ico.tog{font-size:18px;color:#ffd96a;width:32px;height:32px;border-radius:9px;border:2px solid #e9b23a;background:rgba(0,0,0,.35)}
.typeG{color:#ffd96a!important}
.dragos.synth td{padding:8px 7px}
.dragos.synth th{font-size:12.5px;line-height:1.15;padding:7px 6px}
.dragos.synth .tType{color:#ffd96a;font-weight:900;text-align:left}
.dragos.synth .tTot{color:#bfffb0;font-weight:900}
.dragos.synth .tNom{font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.zero{opacity:.35}
.tEtat{color:#ff9fd6}
.cadre.grand .dragos.synth th{white-space:nowrap}
.tAide{text-align:center;font-size:12px;opacity:.75;margin:8px 0 0}
.agrandir{position:absolute;right:5.5cqw;top:1.3cqw;z-index:4;width:30px;height:30px;border-radius:9px;border:2px solid #e9b23a;background:rgba(0,0,0,.45);color:#ffd96a;font-size:18px;font-weight:900;cursor:pointer;padding:0}
.cadre .tableWrap{cursor:zoom-in}
/* vue agrandie */
#grandRoot .grandVue{position:fixed;inset:0;z-index:45;background:rgba(5,15,6,.94);overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 6px 20px;container-type:inline-size}
.grandTop{display:flex;align-items:center;justify-content:space-between;margin:0 6px 6px;color:#ffd96a;font-size:18px}
.grandFermer{width:40px;height:40px;border-radius:12px;border:2px solid #e9b23a;background:linear-gradient(#e2473a,#8a1410);color:#fff;font-size:20px;font-weight:900;cursor:pointer}
.cadre.grand .tableWrap{overflow:visible;cursor:default}
.cadre.grand table.synth{table-layout:fixed;white-space:normal;font-size:clamp(9px,2.6cqw,15px)}
.cadre.grand .dragos.synth th{font-size:clamp(8px,2.4cqw,14px);padding:5px 1px;line-height:1.1}
.cadre.grand .dragos.synth td{padding:8px 2px;word-break:break-word}
.cadre.grand .dragos.synth th:first-child,.cadre.grand .dragos.synth td:first-child{width:17%}
.cadre.grand .dragos.synth th:nth-child(7),.cadre.grand .dragos.synth td:nth-child(7){width:14%}
.cadre.grand .dragos.synth th:nth-child(8),.cadre.grand .dragos.synth td:nth-child(8){width:12%}
.cadre.grand .tag{font-size:clamp(7px,2cqw,12px);padding:2px 4px;white-space:normal}
.cadre.grand .tRow{cursor:pointer}
.cadre.grand .tRow:active td{background:rgba(255,200,60,.25)!important}
/* détail d'un type */
.dtSec{border:2px solid #e9b23a;border-radius:14px;padding:8px;margin-top:10px;background:rgba(0,0,0,.2)}
.dtHead{display:flex;align-items:center;justify-content:space-between;color:#ffd96a;margin-bottom:6px}
.dtRow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(233,178,58,.3)}
.dtNom{flex:1;min-width:0;display:flex;flex-direction:column}
.dtNom small{opacity:.8;font-size:11.5px}
.tySec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:6px 0 -4px}
.tyAide{font-size:12px;color:var(--mut);margin:-2px 0 0}
.tyGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tyGrid>.f{min-width:0}
.stepper.tyStep{display:flex;width:100%}
.stepper.tyStep input{flex:1 1 0;width:0!important;min-width:0;padding:6px 2px}
.tag.mix{background:linear-gradient(#e0a43a,#9a5a10);color:#fff}
.numB{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 4px;border-radius:50%;font-weight:900;font-size:13px;color:#fff3c0;
  background:radial-gradient(circle at 40% 35%,#7a4a14,#3a1e06);border:2px solid #f0bf3a;box-shadow:0 0 0 2px #6a3c0a,0 0 8px rgba(255,200,60,.5);text-shadow:0 1px 0 #000}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12.5px;border:2px solid rgba(255,255,255,.5);text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tag.m{background:linear-gradient(#5aa2ff,#1e5fd6);color:#fff;box-shadow:0 0 6px rgba(70,140,255,.6)}
.tag.f{background:linear-gradient(#ff7cc8,#d42d8e);color:#fff;box-shadow:0 0 6px rgba(255,90,180,.6)}
.tag.oui{background:linear-gradient(#7fe05a,#2e9a22);color:#fff;box-shadow:0 0 6px rgba(120,230,80,.55)}
.tag.non{background:linear-gradient(#8a8a8a,#4a4a4a);color:#eee}
.act{display:flex;gap:6px}
.ico{width:36px;height:36px;border-radius:10px;border:2px solid rgba(255,194,58,.6);background:rgba(255,255,255,.08);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ico:active{transform:scale(.9)}
.ico.del{border-color:rgba(226,59,46,.7)}
.ico:has(img){border:0;background:none;width:42px;height:40px}
.ico.ok{width:40px;height:40px;border-radius:12px;border:3px solid #e9b23a;background:linear-gradient(#5fd36a,#1f8a2c);color:#fff;font-size:22px;font-weight:900;
  text-shadow:0 2px 0 #0d4a14;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 6px rgba(0,0,0,.45)}
.ico.ok.pret{animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 12px rgba(125,255,138,.9),inset 0 2px 0 rgba(255,255,255,.45)}
.ico img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.btn.danger{background:linear-gradient(#ff6b5e,#c4271c);color:#fff;border-color:#5a0d07}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tools .btn{font-size:15px;padding:12px 10px}
/* fenêtres (modales) */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:#1c2412;border:3px solid var(--gold);border-radius:20px;padding:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal h3{margin:0 0 10px;color:var(--gold);font-size:20px}
.modal ul{margin:6px 0 12px;padding-left:20px;line-height:1.5}
.modal .warn{background:rgba(226,59,46,.18);border:1px solid rgba(226,59,46,.6);border-radius:10px;padding:8px 10px;font-size:14px}
.modal .box form{display:flex;flex-direction:column;gap:12px}
.duo{display:grid;grid-template-columns:1fr;gap:8px;align-items:end}
#newParcBtn img{margin-bottom:1.1%} /* aligne la barre dorée avec celle de Stérilisation */
/* ===== Scintillement sur tous les boutons ===== */
.spk{position:absolute;z-index:3;width:12px;height:12px;pointer-events:none;background:#fffbe0;opacity:0;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px #ffe680);animation:twinkle 2.6s ease-in-out infinite}
.spk.s1{top:3%;left:8%}.spk.s2{bottom:6%;right:7%}.spk.s3{top:20%;right:2%}
@keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.2) rotate(0)}80%{opacity:1;transform:scale(1.1) rotate(45deg)}90%{opacity:.6;transform:scale(.7) rotate(90deg)}}
/* en-tête : bouton retour + plaque de titre */
.topImg{display:flex;align-items:center;gap:6px;margin:0 0 12px}
.back.arrowBack{width:19%;max-width:84px;height:auto;flex:none;border:0;background:none;padding:0;border-radius:0}
.arrowBack img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.titrePl{position:relative;flex:1;min-width:0}
.vueBtn{flex:none;width:15%;max-width:64px;aspect-ratio:1;border-radius:14px;border:3px solid #e9b23a;cursor:pointer;padding:0;
  background:radial-gradient(circle at 40% 30%,#3f8a3a,#14401a);color:#ffe9a8;font-size:clamp(18px,6vw,28px);line-height:1;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 2px #6a3c0a,0 5px 10px rgba(0,0,0,.45);text-shadow:0 2px 0 #2a1204}
.vueBtn:active{transform:scale(.92)}
.titrePl img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.titrePl span{position:absolute;left:13.5%;right:13.5%;top:36%;height:36%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;
  font-size:clamp(18px,6.4vw,32px);font-weight:900;color:#ffe066;text-shadow:0 3px 0 #6a2e05,1px 1px 0 #4a1e03,-1px -1px 0 #4a1e03,1px -1px 0 #4a1e03,-1px 1px 0 #4a1e03,0 0 10px rgba(255,200,60,.6)}
/* plaque de groupe (parc · nombre) */
.grpPl{position:relative;margin:18px 0 10px}
.grpPl img{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
.grpPl span{position:absolute;left:27%;right:24%;top:26%;height:36%;display:flex;align-items:center;justify-content:center;text-align:center;gap:4px;white-space:nowrap;
  font-size:clamp(10px,3.2vw,17px);font-weight:900;color:#ffeab8;line-height:1.35;overflow:visible;text-shadow:0 2px 0 #3a1a04,1px 1px 0 #2a1204,-1px -1px 0 #2a1204}
.grpPl .gn{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-top:2px}
.arrowBack:active,.hdrG:active{transform:scale(.95)}
/* bandeau titre avec nom de guilde */
.back.hdrG{position:relative;display:block;width:100%;height:auto;border:0;background:none;padding:0;border-radius:0;margin:0 0 12px;cursor:pointer}
.hdrG img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.hdrG .hdrTxt{position:absolute;left:22%;right:6.5%;top:39%;height:33%;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(15px,5.2vw,28px);font-weight:900;color:#ffe9a8;line-height:1.05;overflow:hidden;
  text-shadow:0 2px 0 #5a2c06,1px 1px 0 #3a1a04,-1px -1px 0 #3a1a04,0 0 10px rgba(255,170,40,.6)}
.hdrG:active{transform:scale(.97)}
/* cadres mâles / femelles disponibles */
.statImg{position:relative;width:100%}
.statImg img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.statImg .sv{position:absolute;left:35%;right:12%;top:13%;height:57%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.statImg .sv b{font-size:clamp(18px,6vw,30px);font-weight:900}
.statImg .sv span{font-size:clamp(9px,2.7vw,13px);font-weight:800;color:#ffeccc;text-shadow:0 1px 0 #000,0 0 4px #000;margin-top:2px;text-align:center}
.statImg.m .sv b{color:#bfe3ff;text-shadow:0 0 8px #2f8cff,0 2px 0 #062a5a}
.statImg.f .sv b{color:#ffd0ee;text-shadow:0 0 8px #ff3fb4,0 2px 0 #4a0638}
/* ---- Accouchements ---- */
.card.gest{position:relative;padding:14px 14px 12px;margin-bottom:14px;border-radius:22px;border:3px solid #e9b23a;
  background:radial-gradient(ellipse at 50% 0%,#1d4430 0%,#0e2619 70%);box-shadow:inset 0 0 0 2px rgba(120,60,0,.6),inset 0 0 22px rgba(255,190,60,.18),0 8px 18px rgba(0,0,0,.5);backdrop-filter:none}
.gest .who{display:flex;flex-direction:column;gap:4px}

/* =====================================================================
   THÈME ÉPURÉ — remplace tout le style illustré
   ===================================================================== */
:root{--bg:#f5f4f0;--card:#ffffff;--line:#e4e1da;--ink:#1f2421;--mut:#7a7f7b;--acc:#2f6b4f;--acc2:#e7f0eb;--dan:#b8392e;--m:#3b6fd6;--f:#d24b8f}
html,body{background:var(--bg)!important;color:var(--ink)!important}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif!important;-webkit-font-smoothing:antialiased}
*{text-shadow:none!important}
.page{padding:16px 16px 40px!important;gap:0}
img{filter:none!important}
.muted,.muted *{color:var(--mut)!important;opacity:1!important}
/* boutons */
.btn,.stB,button.combo,.imgBtn,.accBtn,.vueBtn,.grandFermer,.agrandir,.back,.stDetailBtn{font-family:inherit!important;animation:none!important}
.btn,.imgBtn,.accBtn,.stB{display:flex!important;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 14px!important;border-radius:10px!important;
  border:1px solid var(--line)!important;background:var(--card)!important;color:var(--ink)!important;font-size:15px!important;font-weight:600!important;box-shadow:none!important;
  min-height:46px;height:auto;cursor:pointer;aspect-ratio:auto!important;text-align:center}
#newParcBtn,#addDrago,.accBtn,.btn:not(.ghost):not(.danger):not(.parcBtn),.stB.valider,#w_suiv,#s_next,#w_next{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.btn.danger,.stB.rouge,#delParc{background:#fff!important;color:var(--dan)!important;border-color:#e8c4bf!important}
.btn:active,.imgBtn:active,.stB:active,.accBtn:active{transform:none!important;opacity:.7}
.stB i{display:none!important}
.formBtns,.tools,.duo,.stBas,.stOutils{gap:8px!important;align-items:stretch!important}
/* en-têtes */
.top,.topImg{display:flex!important;align-items:center;gap:10px;margin:0 0 18px!important}
.back,.back.arrowBack,.back.imgBack,.back.hdrG{width:auto!important;max-width:none!important;height:auto!important;flex:none;padding:0!important;border:0!important;background:none!important;
  display:flex!important;align-items:center;gap:10px;font-size:22px!important;color:var(--ink)!important;box-shadow:none!important;margin:0 0 18px!important}
.topImg .back{margin:0!important}
.back .arr,.arrowBack{font-size:22px;line-height:1;color:var(--ink)}
.hdrG .hdrTxt,.imgBack .hdrTxt,.titrePl span,.top h2{position:static!important;display:block!important;height:auto!important;font-size:22px!important;font-weight:700!important;color:var(--ink)!important;
  text-align:left!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.titrePl{flex:1;min-width:0}
.vueBtn{width:40px!important;height:40px;aspect-ratio:auto!important;border-radius:10px!important;border:1px solid var(--line)!important;background:var(--card)!important;color:var(--ink)!important;font-size:18px!important;box-shadow:none!important}
h4.sec{color:var(--mut)!important;font-size:12px!important;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin:22px 0 8px!important}
/* accueil */
#home{justify-content:flex-start!important;padding-top:84px!important;gap:10px!important}
#home::before{content:"Drago Gestion";font-size:28px;font-weight:700;letter-spacing:-.4px;margin:0 0 14px}
.tile,.row .tile{width:100%;display:flex!important;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:18px!important;border-radius:14px!important;
  background:var(--card)!important;border:1px solid var(--line)!important;text-align:left;min-height:84px}
.tile .tileT{font-size:18px;font-weight:700;color:var(--ink)}
.tile .tileS{font-size:13px;color:var(--mut)}
.row{grid-template-columns:1fr 1fr!important;gap:10px!important;align-items:stretch!important}
#refresh,#newsBtn{position:fixed!important;top:calc(16px + env(safe-area-inset-top))!important;width:auto!important;height:38px;padding:0 14px!important;border-radius:999px!important;

/* gestations */

/* fenêtres */

.stepper.stStep button,.stepper button{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important}
.stDetailBtn{color:var(--acc)!important;font-weight:600!important}

.finPill span:last-child{color:var(--acc)!important;font-style:normal!important;font-weight:600!important;text-align:left}
.finPill em{color:var(--acc)!important;font-style:normal}
.finTxt{color:var(--ink)!important;font-weight:400!important;text-align:left}
.finTxt b{color:var(--ink)!important}
.finSep{display:none!important}
.finBox{text-align:left!important}
.dtSec{background:none!important;border:1px solid var(--line)!important}
.dtHead{color:var(--ink)!important}
.spk{display:none!important}
.ready{color:var(--acc)!important}
.pair .when{color:var(--mut)}
.maj h3{color:var(--ink)!important}
#sortInfo{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--mut)}

.dragos.accT{table-layout:fixed;white-space:normal;font-size:13.5px}
.dragos.accT td,.dragos.accT th{padding:8px 3px!important;overflow-wrap:break-word}
.dragos.accT th{font-size:11.5px!important;word-break:normal}
.dragos.accT th:nth-child(1),.dragos.accT td:nth-child(1){width:26%}

/* ===== Mode sombre ===== */
#themeBtn{position:fixed!important;top:calc(16px + env(safe-area-inset-top));left:66px;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}

<body>

<!-- ============ ACCUEIL ============ -->
<section id="home" class="page">
  <button id="refresh" class="shine" aria-label="Rafraîchir l'application" title="Chercher la dernière mise à jour">⟳</button>
  <button id="themeBtn" aria-label="Mode sombre"></button>
  <button id="newsBtn" class="shine" data-go="news" aria-label="Mises à jour">Mises à jour<i id="newsDot" hidden></i></button>
  <button class="tile shine" data-go="parcs" aria-label="Gestion des parcs">
    <span class="tileT">Gestion des parcs</span><span class="tileS">Parcs, dragodindes, stériles</span>
  </button>
  <div class="row">
    <button class="tile shine" data-go="accouplements" aria-label="Accouplements">
      <span class="tileT">Accouplements</span>

</section>

<script>
// Journal des mises à jour : la plus récente en premier.
const MAJ=[

  {v:18,d:"31/10/2026",t:["Nouveau bandeau avec le nom de la guilde (et la flèche de retour) en haut de la page d'un parc et de ses accouplements.","Cadres illustrés « mâles disponibles » et « femelles disponibles » dans la page d'accouplement d'un parc.","Nouvelles cartes de gestation dans Accouchements : minuteur avec l'œuf violet, œuf doré quand elle est prête, barre de progression dorée, dates Début / Fin.","Nouveaux boutons Modifier (crayon) et Supprimer (corbeille) partout dans l'appli."]},
  {v:17,d:"31/10/2026",t:["Accouchements : chaque gestation issue d'un accouplement s'affiche avec un grand minuteur (jours, heures, minutes, secondes), une barre de progression et « Prête à accoucher ! » à la fin.","Nouveau bouton « Stérilisation » à côté de « Créer un parc » : choix du parc, puis du type, puis des dragodindes à classer stériles. Elles sont retirées du parc.","Registre des stériles dans la page Stérilisation, avec possibilité de remettre une dragodinde dans son parc ↩️ ou de la supprimer.","Accoupler : les dragodindes déjà en gestation restent proposées, le nombre de couples possibles ne baisse plus après validation."]},

<script>
// Stockage : toutes les clés sont préfixées "drago_" pour ne jamais se mélanger
// avec les autres applis hébergées sur la même adresse GitHub (Quiz Master Quest, belote…).
const Store={
  get(k,d){try{const v=localStorage.getItem("drago_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("drago_"+k,JSON.stringify(v))}catch(e){}}
};

// Navigation entre les pages (le bouton retour du téléphone fonctionne aussi)
const PAGES=["home","parcs","accouplements","accouchements","news","steril"];
let depth=0; // nombre de pages ouvertes depuis l'appli (pour que ← fasse un vrai retour)
function show(){
  const id=location.hash.slice(1);
  let p=PAGES.includes(id)?id:"home";
  if(id.startsWith("parc-")){ if(renderParc(id.slice(5))) p="parc"; else p="parcs"; }
  if(id.startsWith("acc-")){ if(renderAcc(id.slice(4))) p="acc"; else p="accouplements"; }
  if(p==="parcs") renderParcs();
  if(p==="accouplements") renderAccParcs();
  if(p==="accouchements") renderGest();
  if(p==="steril") renderSteril();
  document.querySelectorAll(".page").forEach(s=>s.classList.toggle("on",s.id===p));
  scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");if(!b)return;
  const to=b.dataset.go;
  if(b.classList.contains("back")){ if(depth>0){depth--;history.back();} else location.replace("#"+(to==="home"?"":to)); }
  else { depth++; location.hash=to; }
});
addEventListener("hashchange",show);
// en changeant de page : on ferme les fenêtres ouvertes et la vue agrandie
addEventListener("hashchange",()=>{document.getElementById("modalRoot").innerHTML="";document.getElementById("pickRoot").innerHTML="";if(grandOuvert)fermerGrandVraiment();});

// ================= GESTION DES PARCS =================
// Données : drago_parcs = [{id, guilde, dragos:[{nom,type,sexe,repro,cam,objet,gest}]}]
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// chaque dragodinde reçoit un identifiant (utile pour les accouplements)
function getParcs(){
  const L=Store.get("parcs",[]); let ch=false;
  L.forEach(p=>p.dragos.forEach(d=>{if(!d.id){d.id=uid();ch=true;}}));
  if(ch)Store.set("parcs",L); return L;
}
// Accouplements : drago_accs = [{id,parcId,maleId,femId,debut(ms),gestH,gestTxt}]
const getAccs=()=>Store.get("accs",[]);
const setAccs=a=>Store.set("accs",a);
const form=document.getElementById("parcForm");
let curParc=null;
const plaque=(go,nom,info)=>`<button class="btn parcBtn shine" data-go="${go}"><span class="nomG">${esc(nom)}</span><span class="nbG">${info}</span></button>`;
function renderParcs(){
  const L=getParcs(), el=document.getElementById("parcList");
  document.getElementById("resetAll").hidden=!L.length;
  el.innerHTML=L.length?L.map(p=>plaque(`parc-${p.id}`,p.guilde,pl(p.dragos.length,"# dragodinde","# dragodindes"))).join("")
    :(form.hidden?`<div class="card empty muted">Aucun parc pour l'instant.</div>`:"");
}
// ---- Tri (affichage seulement : le n° de chaque dragodinde ne change pas) ----
const TRIS=[["","Ordre d'ajout"],["nom","Nom"],["type","Type"],["sexe","Sexe"],["repro","Reproductrice"],["cam","Caméléone"],["gest","Temps de gestation"]];
const getTri=()=>Store.get("tri",{k:"",dir:1});
function trier(L){
  const {k,dir}=getTri(), A=L.map((d,i)=>({d,i}));
  if(!k) return dir<0?A.reverse():A;
  const cle=d=>k==="gest"?(gestHeures(d.gest)??Infinity):k==="sexe"?(d.sexe==="M"?"Mâle":"Femelle"):k==="repro"||k==="cam"?(d[k]==="oui"?0:1):String(d[k]||"").toLowerCase();
  return A.sort((a,b)=>{const x=cle(a.d),y=cle(b.d);return (x<y?-1:x>y?1:a.i-b.i)*dir;});
}
// ---- Regroupement : une ligne par type et par sexe ----
const groupesOuverts=new Set(); let groupesCache=[];
function groupes(p){
  const G=new Map();
  trier(p.dragos).forEach(x=>{const t=(x.d.type||"").trim()||"Sans type", k=t.toLowerCase()+"|"+x.d.sexe;
    if(!G.has(k))G.set(k,{key:k,type:t,sexe:x.d.sexe,items:[]}); G.get(k).items.push(x);});
  return groupesCache=[...G.values()];
}
// ---- Tableau de synthèse : une ligne par type ----
let typesCache=[];
function syntheseTypes(p){
  const ordre=[], T=new Map(), S=getSter().filter(x=>x.parcId===p.id), A=getAccs().filter(a=>a.parcId===p.id);
  const byId=Object.fromEntries([...S,...p.dragos].map(d=>[d.id,d]));
  const get=t=>{const k=t.toLowerCase(); if(!T.has(k)){T.set(k,{type:t,items:[],sM:0,sF:0,etat:0});ordre.push(k);} return T.get(k);};
  trier(p.dragos).forEach(x=>get((x.d.type||"").trim()||"Sans type").items.push(x));
  S.forEach(x=>{const g=get((x.type||"").trim()||"Sans type"); x.sexe==="M"?g.sM++:g.sF++;});
  A.forEach(a=>{const f=byId[a.femId]||byId[a.maleId]; if(f)get((f.type||"").trim()||"Sans type").etat++;});
  return typesCache=ordre.map(k=>T.get(k));
}
function tableauParc(p,grand){
  const L=syntheseTypes(p), nM=p.dragos.filter(d=>d.sexe==="M").length;
  const z=v=>v?v:`<span class="zero">0</span>`;
  const rows=L.map((g,gi)=>{
    const D=g.items.map(x=>x.d), M=D.filter(d=>d.sexe==="M").length, F=D.length-M;
    const noms=[...new Set(D.map(d=>d.nom||""))];
    return `<tr class="tRow" data-trow="${gi}"><td class="tType">${esc(g.type)}</td><td>${z(M)}</td><td>${z(F)}</td><td>${z(D.filter(d=>d.repro==="oui").length)}</td><td>${z(D.filter(d=>d.cam==="oui").length)}</td>
      <td class="tTot">${z(D.length)}</td><td class="tNom">${noms.length>1?"<i class='muted'>Plusieurs</i>":esc(noms[0])||"—"}</td>
      <td>${g.etat?(grand?`<b class="tEtat">${g.etat}</b>`:`<span class="tag oui">${pl(g.etat,"# accouplé","# accouplés")}</span>`):`<span class="zero">—</span>`}</td><td>${z(g.sM)}</td><td>${z(g.sF)}</td></tr>`;}).join("");
  return `<div class="cadre ${grand?"grand":""}"><div class="cadreTitre">${pl(p.dragos.length,"# dragodinde","# dragodindes")} · ♂ ${nM} · ♀ ${p.dragos.length-nM}</div>
    ${grand?"":`<button class="agrandir" id="agrandir" aria-label="Agrandir le tableau">⤢</button>`}
    <div class="tableWrap"><table class="dragos synth">
    <thead><tr>${(grand?["Type","♂","♀","Re-<br>pro","Ca-<br>mél.","Tot.","Nom","État","Stér.<br>♂","Stér.<br>♀"]:["Type","♂<br>Mâles","♀<br>Femelles","Repro-<br>ductrices","Camé-<br>léones","Total","Nom","État","Stériles<br>♂","Stériles<br>♀"]).map(h=>`<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table>${L.length?"":`<p class="muted" style="text-align:center;padding:20px 0">Ce parc est vide.</p>`}</div>
    <p class="tAide">${grand?"Touche une ligne pour modifier ce type.":"Touche le tableau pour l'agrandir en paysage."}</p></div>`;
}
function ouvrirGrandGest(parcId){ curParc=parcId; ouvrirGrand(tableauGest(getParcs().find(x=>x.id===parcId),true)); }
// ===== Vue agrandie (plein écran, paysage) =====
// Structure : .grandVue (plein écran, jamais tournée) > .grandIn (contenu, tourné de 90° si le téléphone reste en portrait)
// Le bouton ✕ est en dehors du contenu tourné : toujours visible et toujours cliquable.
let grandOuvert=false, grandForce=false;
function ouvrirGrand(contenu){
  const p=parcCourant(), o=document.getElementById("grandRoot"), garderScroll=o.querySelector(".grandIn");
  const sx=garderScroll?garderScroll.scrollLeft:0, sy=garderScroll?garderScroll.scrollTop:0;
  o.innerHTML=`<div class="grandVue"><div class="grandIn"><div class="grandTop"><b>${esc(p.guilde)}</b></div>${typeof contenu==="string"?contenu:tableauParc(p,true)}</div></div>
    <button class="grandFermer" id="grandFermer" aria-label="Fermer">✕</button>`;
  document.getElementById("grandFermer").onclick=fermerGrand;
  const inn=o.querySelector(".grandIn");
  if(!grandOuvert){ // première ouverture : on essaie le vrai mode paysage (Android), sinon on fait pivoter l'affichage
    grandOuvert=true; grandForce=false;

// calcule la rotation selon l'écran réel
function placerGrand(){
  const v=document.querySelector("#grandRoot .grandVue"), inn=v&&v.querySelector(".grandIn"); if(!inn)return;
  const W=v.clientWidth, H=v.clientHeight, pivot=grandForce&&H>W;
  v.classList.toggle("pivot",pivot);
  if(pivot){inn.style.width=H+"px";inn.style.height=W+"px";inn.style.transform=`translateX(${W}px) rotate(90deg)`;}
  else{inn.style.width=inn.style.height=inn.style.transform="";}
  ajusterTable(inn);
}
// réduit la taille du texte jusqu'à ce que la ligne entière tienne en largeur
function ajusterTable(inn){
  const t=inn.querySelector("table"); if(!t)return;

  while(t.scrollWidth>inn.clientWidth-8&&f>8){f-=.5;t.style.fontSize=f+"px";}

// glisser du doigt dans la vue tournée (les axes sont inversés par la rotation)
function brancherGlisser(inn){
  let x0=0,y0=0,bouge=false;
  inn.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;bouge=false;},{passive:true});
  inn.addEventListener("touchmove",e=>{
    if(!document.querySelector(".grandVue.pivot"))return;      // sans rotation : défilement normal
    const t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=t.clientX; y0=t.clientY;
    inn.scrollTop+=dx; inn.scrollLeft-=dy; bouge=true; e.preventDefault();
  },{passive:false});
  inn.addEventListener("click",e=>{if(bouge){e.stopPropagation();e.preventDefault();bouge=false;}},true);
}

function menus(root){
  root.querySelectorAll("input[data-dl]").forEach(inp=>{
    if(inp.dataset.req===undefined)inp.dataset.req=inp.required?"1":"";
    if(inp.previousElementSibling?.classList.contains("combo"))inp.previousElementSibling.remove();
    const vals=valeursConnues(inp.dataset.dl), req=inp.dataset.req==="1";
    inp.required=req; inp.classList.remove("cache");
    if(!vals.length)return;                                   // rien d'enregistré : saisie libre
    const titre=inp.closest(".f")?.querySelector("span,label")?.textContent||"Choisir";
    const btn=document.createElement("button"); btn.type="button"; btn.className="combo";
    inp.before(btn);
    const mode=nouveau=>{inp.classList.toggle("cache",!nouveau);};
    const affiche=()=>{const v=inp.value.trim();btn.textContent=nouveau?"➕ Nouveau…":(v||"— Choisir —");btn.classList.toggle("vide",!v&&!nouveau);};
    let nouveau=!!inp.value.trim()&&!vals.includes(inp.value.trim());
    mode(nouveau); affiche();
    btn.onclick=async()=>{
      const v=await pickList({titre,current:nouveau?"__new":inp.value.trim(),options:[...vals.map(x=>({value:x,label:esc(x)})),{value:"__new",label:"➕ Nouveau…"}]});

// Temps de gestation saisi en texte ("48 h", "2 j", "1 j 12 h", "90 min", "48") → heures
function gestHeures(t){
  t=String(t||"").toLowerCase().replace(",",".");
  let h=0,ok=false; const re=/(\d+(?:\.\d+)?)\s*(j|jour|jours|d|h|heure|heures|min|mn|m)?/g; let m;
  while((m=re.exec(t))){ok=true;const n=parseFloat(m[1]),u=m[2]||"h";h+=u.startsWith("j")||u==="d"?n*24:u.startsWith("m")?n/60:n;}
  return ok&&h>0?h:null;
}

function reste(ms){const m=Math.round(ms/60000);if(m<=0)return null;const j=Math.floor(m/1440),h=Math.floor(m%1440/60),mn=m%60;return (j?j+" j ":"")+(h?h+" h ":"")+(!j&&mn?mn+" min":"");}

const toLocalInput=ms=>{const d=new Date(ms-new Date(ms).getTimezoneOffset()*60000);return d.toISOString().slice(0,16);};

// Fenêtre d'accouplement (création ou modification)
function accWindow(edit){
  const p=accParc(), root=document.getElementById("modalRoot"), E=etat(p);
  // en modification, la femelle déjà liée reste sélectionnable
  if(edit)E.forEach(e=>{if(e.d.id===edit.femId||e.d.id===edit.maleId)e.raison="";});
  const M=E.filter(e=>e.d.sexe==="M"), F=E.filter(e=>e.d.sexe==="F");
  if(!edit&&(!M.some(e=>!e.raison)||!F.some(e=>!e.raison))){
    root.innerHTML=`<div class="modal"><div class="box"><h3>Accouplement impossible</h3><p>Il faut au moins un <b>mâle</b> et une <b>femelle</b> reproducteurs et disponibles dans le parc <b>${esc(p.guilde)}</b>.</p>
      <p class="muted">Mâles disponibles : ${M.filter(e=>!e.raison).length} · Femelles disponibles : ${F.filter(e=>!e.raison).length}</p><button class="btn" id="x_ok">Compris</button></div></div>`;
    document.getElementById("x_ok").onclick=()=>root.innerHTML=""; return;
  }
  root.innerHTML=`<div class="modal"><div class="box"><h3>${edit?"Modifier l'accouplement":"Accouplement"} – ${esc(p.guilde)}</h3>
    <form id="accForm"><div class="pick">
      <div class="col"><h5 style="color:#6ea8ff">♂ Mâles</h5>${M.map(e=>optHtml(e,"am",edit?e.d.id===edit.maleId:false)).join("")||'<span class="muted">Aucun</span>'}</div>
      <div class="col"><h5 style="color:#ff7cc4">♀ Femelles</h5>${F.map(e=>optHtml(e,"af",edit?e.d.id===edit.femId:false)).join("")||'<span class="muted">Aucune</span>'}</div>
    </div>
    <div class="f"><span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Date et heure de l'accouplement</span><input type="datetime-local" id="a_date" value="${toLocalInput(edit?edit.debut:Date.now())}" required></div>
    <div class="formBtns"><button type="button" class="btn ghost" id="a_cancel">Annuler</button><button type="submit" class="btn">${edit?"Enregistrer":"Accoupler"}</button></div></form></div></div>`;
  document.getElementById("a_cancel").onclick=()=>root.innerHTML="";
  document.getElementById("accForm").onsubmit=async e=>{
    e.preventDefault();
    const f=e.target, mi=f.querySelector("[name=am]:checked")?.value, fi=f.querySelector("[name=af]:checked")?.value;
    if(!mi||!fi){alertBox("Choisis un mâle et une femelle.");return;}
    const m=p.dragos.find(d=>d.id===mi), fe=p.dragos.find(d=>d.id===fi);
    const debut=new Date(document.getElementById("a_date").value).getTime()||Date.now();
    const gestH=gestHeures(fe.gest), fin=gestH?debut+gestH*3600000:null;
    const lignes=edit?[]:[`<b>${esc(m.nom)}</b> (♂ ${esc(m.type)}) sera accouplé avec <b>${esc(fe.nom)}</b> (♀ ${esc(fe.type)}) dans le parc <b>${esc(p.guilde)}</b>.`];
    if(edit){
      const byId=Object.fromEntries(p.dragos.map(d=>[d.id,d]));
      if(mi!==edit.maleId)lignes.push(`<b>Mâle</b> : ${esc(byId[edit.maleId]?.nom)} → ${esc(m.nom)}`);
      if(fi!==edit.femId)lignes.push(`<b>Femelle</b> : ${esc(byId[edit.femId]?.nom)} → ${esc(fe.nom)}`);
      if(Math.abs(debut-edit.debut)>=60000)lignes.push(`<b>Date</b> : ${fmtDate(edit.debut)} → ${fmtDate(debut)}`);
      if(!lignes.length){root.innerHTML="";return;}
      lignes.unshift(`L'accouplement du parc <b>${esc(p.guilde)}</b> sera modifié :`);
    } else lignes.push(`Date : ${fmtDate(debut)}.`);
    lignes.push(fin?`Naissance prévue le ${fmtDate(fin)} (gestation de ${esc(fe.gest)}).`:`Temps de gestation de ${esc(fe.nom)} non reconnu${fe.gest?" (« "+esc(fe.gest)+" »)":""} : pas de date de naissance calculée.`);

    if(await confirmBox({titre:edit?"Confirmer la modification":"Confirmer l'accouplement",lignes,ok:edit?"Enregistrer":"Accoupler"})){
      const A=getAccs(), rec={id:edit?edit.id:uid(),parcId:p.id,maleId:mi,femId:fi,debut,gestH,gestTxt:fe.gest};
      if(edit)A[A.findIndex(a=>a.id===edit.id)]=rec; else A.push(rec);
      setAccs(A); renderAcc(p.id); if(location.hash==="#accouchements")renderGest();
    } else accWindow(edit);
  };
}
function alertBox(t){const root=document.createElement("div");root.innerHTML=`<div class="modal" style="z-index:60"><div class="box"><p>${t}</p><button class="btn">OK</button></div></div>`;document.body.appendChild(root);root.querySelector(".btn").onclick=()=>root.remove();}
// Assistant : accouplement par type, avec quantité, puis « Suivant » ou « Terminé »
function typesDispo(p){
  const E=etat(p), T={};
  E.forEach(e=>{const t=(e.d.type||"").trim()||"Sans type";T[t]=T[t]||{type:t,M:[],F:[]};if(!e.raison)T[t][e.d.sexe==="M"?"M":"F"].push(e.d);});

  return Object.values(T).map(t=>({...t,max:Math.min(t.M.length,t.F.length)})).sort((a,b)=>a.type.localeCompare(b.type,"fr"));
}
function accWizard(faits=[],dernier=null){
  const p=accParc(), root=document.getElementById("modalRoot"), T=typesDispo(p);
  const possibles=T.filter(t=>t.max>0), reste=possibles.filter(t=>!faits.includes(t.type));
  const fin=dernier?`<p class="done">✅ ${pl(dernier.n,"# accouplement","# accouplements")} de type <b>${esc(dernier.type)}</b> ${pl(dernier.n,"enregistré","enregistrés")}.</p>`:"";
  const blocSter=dernier?`<div class="sterApres"><div class="tySec">Stériles après cet accouplement (${esc(dernier.type)})</div>
    <div class="tyGrid">${["M","F"].map(x=>`<div class="f"><span>${x==="M"?"♂ Mâles":"♀ Femelles"}</span><div class="stepper stStep tyStep"><button type="button" data-sm="${x}">−</button><input type="number" id="ws_${x}" min="0" value="0" inputmode="numeric"><button type="button" data-sp="${x}">＋</button></div></div>`).join("")}</div>
    <button type="button" class="btn ghost" id="ws_ok">Enregistrer les stériles</button><p class="tyAide" id="ws_info"></p></div>`:"";
  if(!reste.length){
    // parc suivant dans la liste (on revient au premier après le dernier)
    const L=getParcs(), k=L.findIndex(x=>x.id===p.id), suiv=L.length>1?L[(k+1)%L.length]:null;
    const allerSuivant=()=>{root.innerHTML=""; location.replace("#acc-"+suiv.id);};
    if(dernier){
      root.innerHTML=`<div class="modal"><div class="box finBox">
        <div class="titrePl finTitre"><span>Parc terminé</span></div>
        
        <div class="finPill"><span>${pl(dernier.n,"# accouplement","# accouplements")} de type <em>${esc(dernier.type)}</em> ${pl(dernier.n,"enregistré","enregistrés")}.</span></div>
        <p class="finTxt">Toutes les dragodindes du parc <b>« ${esc(p.guilde)} »</b> ont été accouplées !</p>
        <div class="finSep"><i></i><i></i></div>
        <p class="finTxt">Tu as sûrement les pieds qui collent, mais passe au suivant : l'argent ne tombe pas du ciel !</p>
        ${blocSter}
        ${suiv?`<button class="imgBtn finSuiv" id="w_suiv" aria-label="Parc suivant">Parc suivant →</button><p class="finProchain">Prochain parc : <b>${esc(suiv.guilde)}</b></p>`:""}
        <button class="imgBtn finFin" id="w_end" aria-label="Terminé">Terminé</button>
      </div></div>`;
      document.getElementById("w_end").onclick=()=>root.innerHTML="";
      if(suiv)document.getElementById("w_suiv").onclick=allerSuivant;
      brancherSter();
      return;
    }
    root.innerHTML=`<div class="modal"><div class="box"><h3>Accouplement – ${esc(p.guilde)}</h3>
      <p>Aucun type ne peut être accouplé : il faut au moins un <b>mâle</b> et une <b>femelle</b> reproducteurs et disponibles du même type.</p>
      <div class="formBtns"${suiv?"":` style="grid-template-columns:1fr"`}><button class="btn ghost" id="w_end">Compris</button>${suiv?`<button class="imgBtn" id="w_suiv" aria-label="Parc suivant">Parc suivant →</button>`:""}</div></div></div>`;
    document.getElementById("w_end").onclick=()=>root.innerHTML="";
    if(suiv)document.getElementById("w_suiv").onclick=allerSuivant;
    return;
  }
  if(dernier){
    root.innerHTML=`<div class="modal"><div class="box"><h3>Accouplement – ${esc(p.guilde)}</h3>${fin}
      ${blocSter}
      <p class="muted" style="text-align:center">Encore ${pl(reste.length,"# type disponible","# types disponibles")} : ${reste.map(t=>esc(t.type)).join(", ")}</p>
      <div class="formBtns imgDuo"><button class="imgBtn" id="w_end" aria-label="Terminé">Terminé</button><button class="imgBtn" id="w_next" aria-label="Suivant">Suivant →</button></div></div></div>`;
    document.getElementById("w_end").onclick=()=>root.innerHTML="";
    document.getElementById("w_next").onclick=()=>formType(reste[0].type);
    brancherSter();
    return;
  }
  // stériliser les dragodindes du type qui vient d'être accouplé (les parents d'abord, leurs gestations sont conservées)
  function brancherSter(){
    const ok=document.getElementById("ws_ok"); if(!ok)return;
    const q=()=>getParcs().find(x=>x.id===p.id), duType=()=>q().dragos.filter(d=>((d.type||"").trim()||"Sans type").toLowerCase()===dernier.type.toLowerCase());
    const val=x=>Math.max(0,parseInt(document.getElementById("ws_"+x).value)||0);
    const maxi=x=>duType().filter(d=>d.sexe===x).length;
    root.querySelectorAll("[data-sm],[data-sp]").forEach(b=>b.onclick=()=>{const x=b.dataset.sm||b.dataset.sp;document.getElementById("ws_"+x).value=Math.min(maxi(x),Math.max(0,val(x)+(b.dataset.sm?-1:1)));});
    ok.onclick=()=>{
      const nM=Math.min(val("M"),maxi("M")), nF=Math.min(val("F"),maxi("F")); if(!nM&&!nF)return;
      const parc=q(), par=new Set(dernier.parents||[]), ordre=L=>[...L].sort((a,b)=>(par.has(b.id)?1:0)-(par.has(a.id)?1:0)||parc.dragos.indexOf(b)-parc.dragos.indexOf(a));
      const choisis=[...ordre(duType().filter(d=>d.sexe==="M")).slice(0,nM),...ordre(duType().filter(d=>d.sexe==="F")).slice(0,nF)], ids=new Set(choisis.map(d=>d.id)), now=Date.now();
      setSter([...getSter(),...choisis.map(d=>({...d,parcId:parc.id,guilde:parc.guilde,date:now}))]);
      parc.dragos=parc.dragos.filter(d=>!ids.has(d.id)); saveParc(parc); renderAcc(parc.id);
      ["M","F"].forEach(x=>document.getElementById("ws_"+x).value=0);
      document.getElementById("ws_info").textContent=`✔ ${pl(nM+nF,"# dragodinde classée stérile","# dragodindes classées stériles")} (♂ ${nM} · ♀ ${nF}). Leurs gestations en cours sont conservées.`;
    };
  }
  formType(reste[0].type);
  function formType(typeChoisi){
    let t=T.find(x=>x.type===typeChoisi);
    const dispoHtml=t=>`<div class="dispo"><span class="tag m">♂ ${t.M.length} ${pl(t.M.length,"mâle dispo","mâles dispo")}</span><span class="tag f">♀ ${t.F.length} ${pl(t.F.length,"femelle dispo","femelles dispo")}</span></div>`;
    root.innerHTML=`<div class="modal"><div class="box"><h3>Accouplement – ${esc(p.guilde)}</h3><form id="wForm">
      <div class="f"><span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Type de dragodinde</span>
        <button type="button" class="combo" id="w_type"></button><div id="w_dispo"></div></div>
      <div class="f"><span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Nombre d'accouplements <span class="muted" id="w_max"></span></span>
        <div class="stepper"><button type="button" class="btn ghost" id="w_moins">−</button><input type="number" id="w_nb" min="1" inputmode="numeric" required><button type="button" class="btn ghost" id="w_plus">＋</button></div></div>
      <div class="f"><span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Date et heure de l'accouplement</span><input type="datetime-local" id="w_date" value="${toLocalInput(Date.now())}" required></div>
      <div class="formBtns"><button type="button" class="btn ghost" id="w_cancel">${faits.length?"Terminé":"Annuler"}</button><button type="submit" class="btn">Accoupler</button></div></form></div></div>`;
    const nb=document.getElementById("w_nb");
    const maj=()=>{
      const b=document.getElementById("w_type"); b.textContent=`${t.type} — ${pl(t.max,"# couple possible","# couples possibles")}`;
      document.getElementById("w_dispo").innerHTML=dispoHtml(t);
      document.getElementById("w_max").textContent=`(1 à ${t.max})`;
      nb.max=t.max; nb.value=t.max;
    };
    maj();
    document.getElementById("w_type").onclick=async()=>{
      const v=await pickList({titre:"Type de dragodinde",current:t.type,options:T.map(x=>({value:x.type,label:esc(x.type)+(faits.includes(x.type)?" ✅":""),
        sub:`♂ ${x.M.length} ${pl(x.M.length,"mâle dispo","mâles dispo")} · ♀ ${x.F.length} ${pl(x.F.length,"femelle dispo","femelles dispo")} · ${x.max?pl(x.max,"# couple possible","# couples possibles"):"aucun couple possible"}`,disabled:!x.max}))});
      if(v){t=T.find(x=>x.type===v);maj();}
    };
    document.getElementById("w_moins").onclick=()=>{nb.value=Math.max(1,(+nb.value||1)-1);};
    document.getElementById("w_plus").onclick=()=>{nb.value=Math.min(t.max,(+nb.value||0)+1);};
    document.getElementById("w_cancel").onclick=()=>root.innerHTML="";
    document.getElementById("wForm").onsubmit=async e=>{
      e.preventDefault();
      const n=Math.max(1,Math.min(t.max,parseInt(nb.value)||1)), debut=new Date(document.getElementById("w_date").value).getTime()||Date.now();
      const males=t.M.slice(0,n), fems=t.F.slice(0,n); // les libres d'abord (tri dans typesDispo)
      const gests=[...new Set(fems.map(f=>f.gest||""))], g0=gestHeures(fems[0].gest);
      const lignes=[`${pl(n,"# couple","# couples")} de dragodindes <b>${esc(t.type)}</b> ${pl(n,"sera formé","seront formés")} dans le parc <b>${esc(p.guilde)}</b>.`,
        `Mâles : ${males.map(d=>esc(d.nom)).join(", ")}`,`Femelles : ${fems.map(d=>esc(d.nom)).join(", ")}`,
        `Date : ${fmtDate(debut)}.`,
        gests.length===1&&g0?`Naissance prévue le ${fmtDate(debut+g0*3600000)} (gestation de ${esc(gests[0])}).`:gests.length>1?"Naissances calculées selon le temps de gestation de chaque femelle.":"Temps de gestation non reconnu : pas de date de naissance calculée.",
        "Chaque gestation apparaîtra dans Accouchements avec son minuteur."];
      const html=root.innerHTML;
      if(await confirmBox({titre:"Confirmer l'accouplement",lignes,ok:"Accoupler"})){
        const A=getAccs();
        const nouveaux=[]; for(let i=0;i<n;i++){const a={id:uid(),parcId:p.id,maleId:males[i].id,femId:fems[i].id,debut,gestH:gestHeures(fems[i].gest),gestTxt:fems[i].gest};A.push(a);nouveaux.push(a);}
        setAccs(A); renderAcc(p.id);
        accWizard([...faits,t.type],{type:t.type,n,parents:nouveaux.flatMap(a=>[a.maleId,a.femId])});
      } else formType(t.type);
    };
  }
}

// ================= ACCOUCHEMENTS (gestations en cours) =================
const deux=n=>String(n).padStart(2,"0");
function minuteur(ms){ // "1 j 23:59:58"
  const s=Math.max(0,Math.floor(ms/1000)), j=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), sec=s%60;
  return (j?j+" j ":"")+deux(h)+":"+deux(m)+":"+deux(sec);
}
// Affichage des gestations : "grille" (2 par ligne) ou "liste" (1 par ligne)
const getVue=()=>Store.get("vueGest","grille");
function majVueBtn(){const b=document.getElementById("vueBtn");const g=getVue()==="grille";b.textContent=g?"☰":"▦";b.title=g?"Afficher une gestation par ligne":"Afficher deux gestations par ligne";}
document.getElementById("vueBtn").onclick=()=>{Store.set("vueGest",getVue()==="grille"?"liste":"grille");renderGest();};
const finG=a=>a.gestH?a.debut+a.gestH*3600000:Infinity;
// cartes de gestation (utilisées dans la fiche d'un type)
function cartesGest(G,p){
  const now=Date.now(), byId=Object.fromEntries(p.dragos.map(d=>[d.id,d]));
  return G.map(a=>{
    const m=byId[a.maleId], f=byId[a.femId], fi=finG(a), reste=fi-now, pct=a.gestH?Math.min(100,Math.max(0,(now-a.debut)/(a.gestH*3600000)*100)):0;
    const tm=!a.gestH?`<div class="timer inconnu"><div class="txt"><div class="t">Temps de gestation non renseigné</div></div></div>`
      :reste<=0?`<div class="timer pret"><div class="txt"><div class="t">Prête à accoucher !</div></div></div>`
      :`<div class="timer"><div class="txt"><div class="l">Temps restant</div><div class="t" data-fin="${fi}">${minuteur(reste)}</div></div></div>`;
    return `<div class="card gest"><div class="head"><div class="who"><span><span class="tag f">♀</span> <b>${esc(f?.nom)}</b></span><span><span class="tag m">♂</span> <b>${esc(m?.nom)}</b></span></div>
        <div class="act"><button class="ico ok ${reste<=0&&a.gestH?"pret":""}" data-gok="${a.id}" aria-label="Valider la gestation terminée">✔</button><button class="ico" data-gedit="${a.id}" aria-label="Modifier">✎</button><button class="ico del" data-gdel="${a.id}" aria-label="Annuler">✕</button></div></div>
      ${tm}${a.gestH?`<div class="barre"><i style="width:${pct.toFixed(1)}%"></i></div>`:""}
      <div class="dates"><span>Début : ${fmtDate(a.debut)}</span><span>${a.gestH?"Fin : "+fmtDate(fi):"Gestation : "+(esc(a.gestTxt)||"—")}</span></div></div>`;
  }).join("");
}
let gestTypes=[], gestFiche=null;
const gestDuType=(p,g)=>{const ids=new Set([...g.items.map(x=>x.d.id),...getSter().filter(x=>x.parcId===p.id&&((x.type||"").trim()||"Sans type").toLowerCase()===g.type.toLowerCase()).map(x=>x.id)]);return getAccs().filter(a=>a.parcId===p.id&&(ids.has(a.femId)||ids.has(a.maleId))).sort((a,b)=>finG(a)-finG(b));};
function tableauGest(p,grand){
  const A=getAccs(), T=syntheseTypes(p), now=Date.now(), z=v=>v?v:`<span class="zero">0</span>`;
  const rows=T.map(g=>{
    const G=gestDuType(p,g), gi=gestTypes.push({p,g})-1, D=g.items.map(x=>x.d), M=D.filter(d=>d.sexe==="M").length, noms=[...new Set(D.map(d=>d.nom||""))];
    const pretes=G.filter(a=>a.gestH&&finG(a)<=now).length, proch=G.find(a=>a.gestH&&finG(a)>now);
    const sous=pretes?`<small class="gPret">${pl(pretes,"# prête","# prêtes")}</small>`:proch?`<small class="gProch" data-fin="${finG(proch)}">${minuteur(finG(proch)-now)}</small>`:"";
    return `<tr class="tRow ${G.length?"":"vide"}" data-grow="${gi}"><td class="tType">${esc(g.type)}</td><td class="tNom">${noms.length>1?"<i class='muted'>Plusieurs</i>":esc(noms[0])||"—"}</td>

  return `<div class="cadre ${grand?"grand":""}" data-gparc="${p.id}">${grand?"":`<button class="agrandir" data-gbig="${p.id}" aria-label="Agrandir">⤢</button>`}

    <p class="tAide">${grand?"Touche une ligne pour modifier ce type.":"Touche le tableau pour l'agrandir en paysage."}</p></div>`;

// Registre : drago_steriles = [{...dragodinde, parcId, guilde, date}]
const sterOuverts=new Set();
const getSter=()=>Store.get("steriles",[]), setSter=v=>Store.set("steriles",v);
function renderSteril(){
  const L=getParcs(), S=getSter();
  document.getElementById("sterParcList").innerHTML=L.length?L.map(p=>`<button class="btn parcBtn shine" data-ster="${p.id}"><span class="nomG">${esc(p.guilde)}</span><span class="nbG">${pl(p.dragos.length,"# dragodinde","# dragodindes")}</span></button>`).join("")
    :`<div class="card empty muted">Aucun parc pour l'instant.</div>`;
  document.getElementById("sterReset").hidden=!S.length;
  const el=document.getElementById("sterList");
  if(!S.length){el.innerHTML=`<div class="card empty muted">Aucune dragodinde stérile enregistrée.</div>`;return;}
  const grp={}; S.forEach((d,i)=>{(grp[d.guilde]=grp[d.guilde]||[]).push({d,i});});
  el.innerHTML=Object.entries(grp).map(([g,arr])=>{
    const sous=new Map(); arr.forEach(x=>{const k=((x.d.type||"").trim()||"Sans type")+"|"+x.d.sexe;(sous.get(k)||sous.set(k,[]).get(k)).push(x);});
    return `<div class="grpPl"><span><em class="gn">${esc(g)}</em>· ${pl(arr.length,"# stérile","# stériles")}</span></div>`+[...sous.entries()].map(([k,L])=>{
      const [t,sx]=k.split("|"), key=g+"|"+k, ouvert=sterOuverts.has(key);
      return `<div class="card sterG"><span class="numB qte">×${L.length}</span><div class="who"><div><span class="tag ${sx==="M"?"m":"f"}">${sx==="M"?"♂ Mâle":"♀ Femelle"}</span> <b>${esc(t)}</b></div></div>
        <button class="ico tog" data-stog="${esc(key)}" aria-label="Voir le détail">${ouvert?"▾":"▸"}</button></div>`
      +(ouvert?`<div class="sterSub">`+L.map(({d,i})=>`<div class="card ster"><div class="who"><div><span class="tag ${d.sexe==="M"?"m":"f"}">${d.sexe==="M"?"♂":"♀"}</span> <b>${esc(d.nom)}</b></div>
      <div class="muted" style="font-size:12.5px;margin-top:3px">Stérile depuis le ${fmtDate(d.date)}${d.cam==="oui"?" · caméléone":""}</div></div>
      <div class="act"><button class="ico" data-srest="${i}" aria-label="Remettre dans le parc">↩️</button><button class="ico del" data-sdel="${i}" aria-label="Supprimer">✕</button></div></div>`).join("")+`</div>`:"");
    }).join("");
  }).join("");
}
document.getElementById("sterParcList").addEventListener("click",e=>{const b=e.target.closest("[data-ster]");if(b)sterWizard(b.dataset.ster);});
function sterWizard(parcId,dernier=null){
  const root=document.getElementById("modalRoot"), p=getParcs().find(x=>x.id===parcId);
  const T={}; p.dragos.forEach((d,i)=>{const t=(d.type||"").trim()||"Sans type";(T[t]=T[t]||[]).push({d,n:i+1});});
  const types=Object.keys(T).sort((a,b)=>a.localeCompare(b,"fr"));
  const fin=dernier?`<p class="done">✅ ${pl(dernier.n,"# dragodinde classée stérile","# dragodindes classées stériles")} (${esc(dernier.type)}).</p>`:"";
  if(!types.length){
    root.innerHTML=`<div class="modal"><div class="box"><h3>Stérilisation – ${esc(p.guilde)}</h3>${fin}<p>${dernier?"Le parc est maintenant vide.":"Ce parc ne contient aucune dragodinde."}</p>${dernier?`<button class="imgBtn" id="s_end" aria-label="Terminé">Terminé</button>`:`<button class="btn" id="s_end">Compris</button>`}</div></div>`;
    document.getElementById("s_end").onclick=()=>{root.innerHTML="";renderSteril();}; return;
  }
  if(dernier){
    root.innerHTML=`<div class="modal"><div class="box"><h3>Stérilisation – ${esc(p.guilde)}</h3>${fin}
      <div class="formBtns imgDuo"><button class="imgBtn" id="s_end" aria-label="Terminé">Terminé</button><button class="imgBtn" id="s_next" aria-label="Suivant">Suivant →</button></div></div></div>`;
    document.getElementById("s_end").onclick=()=>{root.innerHTML="";renderSteril();};
    document.getElementById("s_next").onclick=()=>form(types[0]); return;
  }
  form(types[0]);
  function form(type,coches=[],detail=false){
    const liste=T[type], nM=liste.filter(x=>x.d.sexe==="M").length, nF=liste.length-nM;
    const tri=Store.get("triSter","n"), TRIS_S=[["n","Numéro"],["nom","Nom"],["M","Mâles d'abord"],["F","Femelles d'abord"],["repro","Reproductrices d'abord"],["nonrepro","Non reproductrices d'abord"],["cam","Caméléones d'abord"]];
    const cle={n:x=>x.n,nom:x=>(x.d.nom||"").toLowerCase(),M:x=>x.d.sexe==="M"?0:1,F:x=>x.d.sexe==="F"?0:1,repro:x=>x.d.repro==="oui"?0:1,nonrepro:x=>x.d.repro==="oui"?1:0,cam:x=>x.d.cam==="oui"?0:1}[tri]||(x=>x.n);
    const triee=[...liste].sort((a,b)=>{const x=cle(a),y=cle(b);return x<y?-1:x>y?1:a.n-b.n;});
    const lab=(ic,t)=>`<div class="stLab">${ic}<span>${t}</span></div>`;
    root.innerHTML=`<div class="modal"><div class="box stBox"><form id="sForm">
      <div class="stTitre">Stérilisation – ${esc(p.guilde)}</div>
      ${lab('',"Type de dragodinde")}
      <button type="button" class="combo stCombo" id="s_type">${esc(type)}</button>
      <div class="dispo stDispo"><span class="pil m">♂ ${pl(nM,"# mâle","# mâles")}</span><span class="pil f">♀ ${pl(nF,"# femelle","# femelles")}</span></div>
      <div class="stSec"><div class="stPlank"><span>Dragodindes à classer stériles</span></div>
        <div class="stOutils">
          <button type="button" class="stB vert" id="s_all"><i>✔</i>Tout cocher</button>
          <button type="button" class="stB rouge" id="s_none"><i>✖</i>Tout décocher</button>
        </div>
        ${["M","F"].filter(x=>x==="M"?nM:nF).map(x=>`<div class="stRow stGrp ${coches.length||x?"":""}" data-sx="${x}">
          <span class="stSexe ${x==="M"?"m":"f"}">${x==="M"?"♂":"♀"}</span>
          <span class="stNom"><b>${x==="M"?"Mâles":"Femelles"}</b><small>sur ${x==="M"?nM:nF}</small></span>
          <div class="stepper stStep"><button type="button" class="stMoins">−</button><input type="number" class="stNb" min="0" max="${x==="M"?nM:nF}" value="0" inputmode="numeric"><button type="button" class="stPlus">＋</button></div></div>`).join("")}
        <button type="button" class="stDetailBtn" id="s_det">${detail?"▾ Masquer le détail":"▸ Choisir une par une"}</button>
        <div id="s_detail" ${detail?"":"hidden"}>
        <button type="button" class="combo stCombo stTri" id="s_tri">Trier : ${TRIS_S.find(x=>x[0]===tri)?.[1]}</button>
        <div class="chkList stList">${triee.map(({d,n})=>`<label class="stRow"><input type="checkbox" value="${d.id}" data-sx="${d.sexe}" ${coches.includes(d.id)?"checked":""}><span class="stCase"></span>
          <span class="stSexe ${d.sexe==="M"?"m":"f"}">${d.sexe==="M"?"♂":"♀"}</span>
          <span class="stNom"><b>${esc(d.nom)} n°${n}</b><small>${[d.repro==="oui"?"Reproductrice":"Non reproductrice",d.cam==="oui"?"Caméléone":""].filter(Boolean).join(" · ")}</small></span>
          </label>`).join("")}</div></div></div>
      <div class="stBas"><button type="button" class="stB annuler" id="s_cancel"><i>↩</i>Annuler</button><button type="submit" class="stB valider"><i>✔</i>Valider</button></div>
    </form></div></div>`;
    const cochees=()=>[...root.querySelectorAll(".stList input:checked")].map(b=>b.value);
    document.getElementById("s_tri").onclick=async()=>{
      const c=cochees(), v=await pickList({titre:"Trier les dragodindes",current:tri,options:TRIS_S.map(([k,l])=>({value:k,label:l}))});
      if(v){Store.set("triSter",v);} form(type,c,true);
    };
    document.getElementById("s_type").onclick=async()=>{
      const v=await pickList({titre:"Type de dragodinde",current:type,options:types.map(t=>{const m=T[t].filter(x=>x.d.sexe==="M").length;return {value:t,label:esc(t),sub:`♂ ${pl(m,"# mâle","# mâles")} · ♀ ${pl(T[t].length-m,"# femelle","# femelles")}`};})});
      if(v)form(v);
    };
    const boxes=()=>[...root.querySelectorAll(".stList input")];
    // synchronisation compteurs ⇄ cases
    const sync=()=>root.querySelectorAll(".stGrp").forEach(g=>{const x=g.dataset.sx;g.querySelector(".stNb").value=boxes().filter(b=>b.dataset.sx===x&&b.checked).length;
      g.classList.toggle("on",+g.querySelector(".stNb").value>0);});
    const fixer=(x,n)=>{let k=0;boxes().filter(b=>b.dataset.sx===x).forEach(b=>{b.checked=k<n;k++;});sync();};
    root.querySelectorAll(".stGrp").forEach(g=>{const x=g.dataset.sx,inp=g.querySelector(".stNb"),max=+inp.max;
      g.querySelector(".stMoins").onclick=()=>fixer(x,Math.max(0,(+inp.value||0)-1));
      g.querySelector(".stPlus").onclick=()=>fixer(x,Math.min(max,(+inp.value||0)+1));
      inp.onchange=()=>fixer(x,Math.max(0,Math.min(max,parseInt(inp.value)||0)));});
    root.querySelector(".stList").addEventListener("change",sync);
    document.getElementById("s_det").onclick=()=>form(type,cochees(),!detail);
    sync();
    document.getElementById("s_all").onclick=()=>{boxes().forEach(b=>b.checked=true);sync();};
    document.getElementById("s_none").onclick=()=>{boxes().forEach(b=>b.checked=false);sync();};
    document.getElementById("s_cancel").onclick=()=>{root.innerHTML="";renderSteril();};
    document.getElementById("sForm").onsubmit=async e=>{
      e.preventDefault();
      const ids=boxes().filter(b=>b.checked).map(b=>b.value);
      if(!ids.length){alertBox("Coche au moins une dragodinde.");return;}
      const choisies=liste.filter(x=>ids.includes(x.d.id)), lies=getAccs().filter(a=>ids.includes(a.maleId)||ids.includes(a.femId)).length;
      const ok=await confirmBox({titre:"Confirmer la stérilisation",ok:"Classer stériles",danger:true,lignes:[
        `${pl(ids.length,"# dragodinde","# dragodindes")} <b>${esc(type)}</b> ${pl(ids.length,"sera classée stérile","seront classées stériles")} : ${choisies.map(x=>esc(x.d.nom)+" (n°"+x.n+")").join(", ")}.`,
        `${pl(ids.length,"Elle sera retirée","Elles seront retirées")} du parc <b>${esc(p.guilde)}</b> et ${pl(ids.length,"inscrite","inscrites")} dans le registre des stériles.`,
        ...(lies?[`${pl(lies,"# accouplement/gestation lié sera annulé","# accouplements/gestations liés seront annulés")}.`]:[]),
        `Tu pourras ${pl(ids.length,"la","les")} remettre dans le parc depuis le registre (↩️).`]});
      if(!ok){form(type);return;}
      const L=getParcs(), q=L.find(x=>x.id===p.id), now=Date.now();
      setSter([...getSter(),...q.dragos.filter(d=>ids.includes(d.id)).map(d=>({...d,parcId:q.id,guilde:q.guilde,date:now}))]);
      q.dragos=q.dragos.filter(d=>!ids.includes(d.id)); Store.set("parcs",L);
      setAccs(getAccs().filter(a=>!ids.includes(a.maleId)&&!ids.includes(a.femId)));
      renderSteril(); sterWizard(p.id,{type,n:ids.length});
    };
  }
}
document.getElementById("sterList").addEventListener("click",async e=>{
  const tg=e.target.closest("[data-stog]"); if(tg){const k=tg.dataset.stog;sterOuverts.has(k)?sterOuverts.delete(k):sterOuverts.add(k);renderSteril();return;}
  const r=e.target.closest("[data-srest]"), d=e.target.closest("[data-sdel]"); if(!r&&!d)return;
  const S=getSter(), i=+(r||d).dataset[r?"srest":"sdel"], x=S[i]; if(!x)return;

    const L=getParcs(); let q=L.find(p=>p.id===x.parcId)||L.find(p=>p.guilde.toLowerCase()===x.guilde.toLowerCase());
    if(!await confirmBox({titre:"Remettre dans le parc ?",ok:"Remettre",lignes:[`<b>${esc(x.nom)}</b> (${esc(x.type)}, ${lib.sexe(x.sexe)}) ne sera plus classée stérile.`,

  } else {
    if(!await confirmBox({titre:"Supprimer du registre ?",danger:true,ok:"Supprimer",lignes:[`<b>${esc(x.nom)}</b> (${esc(x.type)}, ${lib.sexe(x.sexe)}, parc ${esc(x.guilde)}) sera effacée du registre des stériles.`],avert:"Cette action est définitive."}))return;
    S.splice(i,1); setSter(S); renderSteril();
  }
});

// Étincelles sur chaque bouton de l'appli, y compris ceux ajoutés plus tard
function scintiller(){
  document.querySelectorAll("button:not([data-sk])").forEach(b=>{
    b.dataset.sk=1;
    if(getComputedStyle(b).position==="static")b.style.position="relative";
    const w=b.offsetWidth||60, taille=Math.round(Math.max(6,Math.min(14,w*.11)));
    (w<70?["s1","s2"]:["s1","s2","s3"]).forEach(k=>{const e=document.createElement("i");e.className="spk "+k;
      e.style.width=e.style.height=(k==="s3"?taille+3:k==="s2"?taille-2:taille)+"px";
      e.style.animationDelay=(Math.random()*2.6).toFixed(2)+"s";e.style.animationDuration=(2.2+Math.random()*1.4).toFixed(2)+"s";b.appendChild(e);});
  });
}
