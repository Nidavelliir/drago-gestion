<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Drago Gestion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drago Gestion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-192.png">
<style>
:root{
  --bg:#1f3d24; --bg2:#14291a; --gold:#ffc23a; --gold2:#e8891c; --ink:#2a1a08; --txt:#fbeecb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;color:var(--txt);
  background:var(--bg) url("fond.webp") center top/cover no-repeat fixed;
  min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.page{display:none;min-height:100dvh;padding:20px 16px 32px;max-width:640px;margin:0 auto}
.page.on{display:flex;flex-direction:column}


/* ---- Accueil ---- */
#home{justify-content:center;gap:10px}
#refresh{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:5;
  width:48px;height:48px;border-radius:14px;border:3px solid #3a2208;cursor:pointer;
  background:linear-gradient(#ffd45c,var(--gold2));color:var(--ink);font-size:26px;font-weight:800;line-height:1;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.4)}
#refresh:active{transform:scale(.92)}
#newsBtn{position:fixed;top:calc(16px + env(safe-area-inset-top));right:12px;z-index:5;
  height:40px;padding:0 14px;border-radius:20px;border:3px solid #3a2208;cursor:pointer;
  background:linear-gradient(#ffd45c,var(--gold2));color:var(--ink);font-size:14px;font-weight:800;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.4)}
#newsBtn:active{transform:scale(.94)}
#newsDot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#e23b2e;border:2px solid #fff}
.maj{margin-bottom:14px}
.maj h3{margin:0 0 6px;color:var(--gold);font-size:17px}
.maj h3 small{color:var(--txt);opacity:.7;font-weight:400;font-size:13px;margin-left:6px}
.maj ul{margin:0;padding-left:20px;line-height:1.45}
#refresh.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tile{border:0;background:none;padding:0;cursor:pointer;display:block;width:100%;
  transition:transform .12s ease,filter .12s ease}
.tile:active{transform:scale(.95);filter:brightness(1.12)}
.tile img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}

/* bouton provisoire en attendant les visuels */
.plate{
  aspect-ratio:1.5/1;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(#ffd45c,var(--gold2));border:4px solid #3a2208;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.45);
}
.plate span{background:#1a1208;color:#ffe08a;font-weight:800;font-size:clamp(11px,3.4vw,17px);max-width:92%;overflow-wrap:anywhere;
  padding:7px 8px;border-radius:10px;border:2px solid var(--gold);letter-spacing:0;text-transform:uppercase}

/* ---- Pages internes ---- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{border:3px solid #3a2208;border-radius:14px;background:linear-gradient(#ffd45c,var(--gold2));
  color:var(--ink);font-weight:800;font-size:22px;width:48px;height:48px;cursor:pointer;flex:none}
.back:active{transform:scale(.92)}
.top h2{margin:0;color:var(--gold);font-size:26px;text-shadow:0 2px 0 #7a3d06,0 0 10px rgba(0,0,0,.9),0 0 3px #000}
.card{background:rgba(22,30,14,.82);border:2px solid rgba(255,194,58,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:18px;padding:18px;line-height:1.45}
.card b{color:var(--gold)}
.muted{opacity:.75;font-size:14px}

/* ---- Gestion des parcs ---- */
.btn{display:block;width:100%;border:3px solid #3a2208;border-radius:16px;cursor:pointer;padding:14px 16px;
  background:linear-gradient(#ffd45c,var(--gold2));color:var(--ink);font-size:18px;font-weight:800;font-family:inherit;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 12px rgba(0,0,0,.45)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(22,30,14,.85);color:var(--txt);border-color:rgba(255,194,58,.6)}
.parcList{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.parcBtn{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:20px;
  background:linear-gradient(#2b1d0c,#1a1208);color:#ffe08a;border:3px solid var(--gold)}
.parcBtn small{font-size:13px;font-weight:600;color:var(--txt);opacity:.8}
form.card{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.f label.t{display:block;font-weight:700;color:var(--gold);margin-bottom:5px;font-size:15px}
.f input[type=text],.f input[type=number]{width:100%;padding:11px 12px;border-radius:10px;border:2px solid rgba(255,194,58,.5);
  background:rgba(255,248,225,.95);color:#2a1a08;font-size:16px;font-family:inherit}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer;
  border:2px solid rgba(255,194,58,.5);background:rgba(255,255,255,.06);font-weight:700}
.choice input{accent-color:var(--gold2);width:18px;height:18px;margin:0}
.choice label:has(input:checked){background:rgba(255,194,58,.28);border-color:var(--gold)}
.formBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.empty{text-align:center}
.tableWrap{overflow-x:auto;border-radius:16px;border:2px solid rgba(255,194,58,.6);background:rgba(22,30,14,.88)}
table.dragos{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.dragos th{background:#1a1208;color:var(--gold);text-align:left;padding:10px;position:sticky;top:0}
.dragos td{padding:10px;border-top:1px solid rgba(255,194,58,.25)}
.dragos tr:nth-child(even) td{background:rgba(255,255,255,.04)}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-weight:700;font-size:12px}
.tag.m{background:#2f6fd6;color:#fff}.tag.f{background:#e0479e;color:#fff}
.tag.oui{background:#3d9a4a;color:#fff}.tag.non{background:rgba(255,255,255,.15)}
.act{display:flex;gap:6px}
.ico{width:36px;height:36px;border-radius:10px;border:2px solid rgba(255,194,58,.6);background:rgba(255,255,255,.08);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ico:active{transform:scale(.9)}
.ico.del{border-color:rgba(226,59,46,.7)}
.btn.danger{background:linear-gradient(#ff6b5e,#c4271c);color:#fff;border-color:#5a0d07}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tools .btn{font-size:15px;padding:12px 10px}
/* fenêtres (modales) */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:#1c2412;border:3px solid var(--gold);border-radius:20px;padding:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal h3{margin:0 0 10px;color:var(--gold);font-size:20px}
.modal ul{margin:6px 0 12px;padding-left:20px;line-height:1.5}
.modal .warn{background:rgba(226,59,46,.18);border:1px solid rgba(226,59,46,.6);border-radius:10px;padding:8px 10px;font-size:14px}
.modal .box form{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>

<!-- ============ ACCUEIL ============ -->
<section id="home" class="page">
  <button id="refresh" aria-label="Rafraîchir l'application" title="Chercher la dernière mise à jour">⟳</button>
  <button id="newsBtn" data-go="news">📜 Mises à jour<i id="newsDot" hidden></i></button>
  <button class="tile" data-go="parcs" aria-label="Gestion des parcs">
    <img src="btn_parcs.webp?v=5" alt="Gestion des parcs">
  </button>
  <div class="row">
    <button class="tile" data-go="accouplements" aria-label="Accouplements">
      <img src="btn_accouplement.webp" alt="Accouplements">
    </button>
    <button class="tile" data-go="accouchements" aria-label="Accouchements">
      <img src="btn_accouchement.webp" alt="Accouchements">
    </button>
  </div>
</section>

<!-- ============ GESTION DES PARCS ============ -->
<section id="parcs" class="page">
  <div class="top"><button class="back" data-go="home" aria-label="Retour">←</button><h2>Gestion des parcs</h2></div>
  <button class="btn" id="newParcBtn">＋ Créer un parc</button>

  <form id="parcForm" class="card" hidden autocomplete="off">
    <div class="f"><label class="t" for="fGuilde">Nom de la guilde</label><input type="text" id="fGuilde" required></div>
    <div class="f"><label class="t" for="fNom">Nom de la dragodinde</label><input type="text" id="fNom" required></div>
    <div class="f"><label class="t" for="fType">Type de la dragodinde</label><input type="text" id="fType" required></div>
    <div class="f"><span class="t" style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Sexe</span>
      <div class="choice"><label><input type="radio" name="sexe" value="M" required> Mâle</label><label><input type="radio" name="sexe" value="F"> Femelle</label></div></div>
    <div class="f"><span class="t" style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Reproductrice</span>
      <div class="choice"><label><input type="radio" name="repro" value="oui" required> Oui</label><label><input type="radio" name="repro" value="non"> Non</label></div></div>
    <div class="f"><span class="t" style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Caméléone</span>
      <div class="choice"><label><input type="radio" name="cam" value="oui" required> Oui</label><label><input type="radio" name="cam" value="non"> Non</label></div></div>
    <div class="f"><label class="t" for="fNb">Nombre de dragodindes à ajouter</label><input type="number" id="fNb" min="1" max="200" value="1" inputmode="numeric" required></div>
    <div class="f"><label class="t" for="fObjet">Objet obtenu à la vente</label><input type="text" id="fObjet"></div>
    <div class="f"><label class="t" for="fGest">Temps de gestation</label><input type="text" id="fGest" placeholder="ex. 48 h"></div>
    <div class="formBtns"><button type="button" class="btn ghost" id="cancelParc">Annuler</button><button type="submit" class="btn">Valider</button></div>
  </form>

  <div class="parcList" id="parcList"></div>
  <button class="btn ghost" id="resetAll" style="margin-top:22px" hidden>♻️ Réinitialiser tous les parcs</button>
</section>

<!-- ============ DÉTAIL D'UN PARC ============ -->
<section id="parc" class="page">
  <div class="top"><button class="back" data-go="parcs" aria-label="Retour">←</button><h2 id="parcTitle">Parc</h2></div>
  <div id="parcBody"></div>
  <div class="tools">
    <button class="btn ghost" id="resetParc">♻️ Réinitialiser le parc</button>
    <button class="btn danger" id="delParc">🗑 Supprimer le parc</button>
  </div>
</section>

<!-- ============ ACCOUPLEMENTS ============ -->
<section id="accouplements" class="page">
  <div class="top"><button class="back" data-go="home" aria-label="Retour">←</button><h2>Accouplements</h2></div>
  <div class="card">
    <p><b>Page en préparation.</b></p>
    <p class="muted">Elle s'appuiera sur ce qui est saisi dans la Gestion des parcs.</p>
  </div>
</section>

<!-- ============ ACCOUCHEMENTS ============ -->
<section id="accouchements" class="page">
  <div class="top"><button class="back" data-go="home" aria-label="Retour">←</button><h2>Accouchements</h2></div>
  <div class="card">
    <p><b>Page en préparation.</b></p>
    <p class="muted">Elle s'appuiera sur ce qui est saisi dans la Gestion des parcs.</p>
  </div>
</section>

<!-- ============ MISES À JOUR ============ -->
<section id="news" class="page">
  <div class="top"><button class="back" data-go="home" aria-label="Retour">←</button><h2>Mises à jour</h2></div>
  <div id="newsList"></div>
</section>

<div id="modalRoot"></div>

<script>
// Journal des mises à jour : la plus récente en premier.
const MAJ=[
  {v:8,d:"31/10/2026",t:["Chaque dragodinde d'un parc peut être modifiée (✏️) ou supprimée (🗑) ligne par ligne.","Nouveaux boutons : réinitialiser un parc, supprimer un parc, réinitialiser tous les parcs.","Chaque modification, réinitialisation ou suppression demande une confirmation avec le récapitulatif de ce qui va se passer."]},
  {v:7,d:"31/10/2026",t:["Gestion des parcs : bouton « Créer un parc » avec le formulaire (guilde, dragodinde, type, sexe, reproductrice, caméléone, nombre, objet à la vente, gestation).","Chaque parc apparaît avec le nom de sa guilde ; en l'ouvrant, on voit ses dragodindes, une par ligne.","Même arrière-plan sur toutes les pages."]},
  {v:6,d:"31/10/2026",t:["Nouvel arrière-plan illustré (le parc et l'écurie) sur toute l'appli."]},
  {v:5,d:"31/10/2026",t:["Nouvelle version, plus nette, du bouton Gestion des parcs."]},
  {v:4,d:"31/10/2026",t:["Nouveaux visuels pour les boutons Accouplements et Accouchements sur l'accueil."]},
  {v:3,d:"31/10/2026",t:["Ajout de cet onglet « Mises à jour » en haut à droite de l'accueil."]},
  {v:2,d:"31/10/2026",t:["Retrait du titre sur l'accueil.","Ajout du bouton ⟳ en haut à gauche pour charger la dernière version de l'appli."]},
  {v:1,d:"31/10/2026",t:["Création de Drago Gestion : accueil avec les boutons Gestion des parcs, Accouplements et Accouchements.","Icône du certificat pour l'installation sur le téléphone."]}
];
</script>

<script>
// Stockage : toutes les clés sont préfixées "drago_" pour ne jamais se mélanger
// avec les autres applis hébergées sur la même adresse GitHub (Quiz Master Quest, belote…).
const Store={
  get(k,d){try{const v=localStorage.getItem("drago_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("drago_"+k,JSON.stringify(v))}catch(e){}}
};

// Navigation entre les pages (le bouton retour du téléphone fonctionne aussi)
const PAGES=["home","parcs","accouplements","accouchements","news"];
let depth=0; // nombre de pages ouvertes depuis l'appli (pour que ← fasse un vrai retour)
function show(){
  const id=location.hash.slice(1);
  let p=PAGES.includes(id)?id:"home";
  if(id.startsWith("parc-")){ if(renderParc(id.slice(5))) p="parc"; else p="parcs"; }
  if(p==="parcs") renderParcs();
  document.querySelectorAll(".page").forEach(s=>s.classList.toggle("on",s.id===p));
  scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");if(!b)return;
  const to=b.dataset.go;
  if(b.classList.contains("back")){ if(depth>0){depth--;history.back();} else location.replace("#"+(to==="home"?"":to)); }
  else { depth++; location.hash=to; }
});
addEventListener("hashchange",show);

// ================= GESTION DES PARCS =================
// Données : drago_parcs = [{id, guilde, dragos:[{nom,type,sexe,repro,cam,objet,gest}]}]
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getParcs=()=>Store.get("parcs",[]);
const form=document.getElementById("parcForm");
let curParc=null;
function renderParcs(){
  const L=getParcs(), el=document.getElementById("parcList");
  document.getElementById("resetAll").hidden=!L.length;
  el.innerHTML=L.length?L.map(p=>`<button class="btn parcBtn" data-go="parc-${p.id}">${esc(p.guilde)}<small>${p.dragos.length} dragodinde${p.dragos.length>1?"s":""}</small></button>`).join("")
    :(form.hidden?`<div class="card empty muted">Aucun parc pour l'instant.</div>`:"");
}
function renderParc(id){
  const p=getParcs().find(x=>x.id===id); if(!p) return false;
  curParc=id;
  document.getElementById("parcTitle").textContent=p.guilde;
  const oui=v=>`<span class="tag ${v}">${v==="oui"?"Oui":"Non"}</span>`;
  document.getElementById("parcBody").innerHTML=`<div class="tableWrap"><table class="dragos">
    <thead><tr><th>#</th><th>Actions</th><th>Nom</th><th>Type</th><th>Sexe</th><th>Reproductrice</th><th>Caméléone</th><th>Objet à la vente</th><th>Gestation</th></tr></thead>
    <tbody>${p.dragos.map((d,i)=>`<tr><td>${i+1}</td>
      <td><div class="act"><button class="ico" data-edit="${i}" aria-label="Modifier">✏️</button><button class="ico del" data-del="${i}" aria-label="Supprimer">🗑</button></div></td>
      <td><b>${esc(d.nom)}</b></td><td>${esc(d.type)}</td>
      <td><span class="tag ${d.sexe==="M"?"m":"f"}">${d.sexe==="M"?"♂ Mâle":"♀ Femelle"}</span></td>
      <td>${oui(d.repro)}</td><td>${oui(d.cam)}</td><td>${esc(d.objet)||"—"}</td><td>${esc(d.gest)||"—"}</td></tr>`).join("")}</tbody></table></div>`
    +(p.dragos.length?"":`<div class="card empty muted">Ce parc est vide.</div>`);
  return true;
}
document.getElementById("newParcBtn").onclick=()=>{form.reset();form.hidden=false;document.getElementById("newParcBtn").hidden=true;renderParcs();document.getElementById("fGuilde").focus();};
function closeForm(){form.hidden=true;document.getElementById("newParcBtn").hidden=false;renderParcs();}
document.getElementById("cancelParc").onclick=closeForm;
form.addEventListener("submit",e=>{
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim(), r=n=>form.querySelector(`input[name=${n}]:checked`).value;
  const guilde=v("fGuilde"), nb=Math.max(1,Math.min(200,parseInt(v("fNb"))||1));
  const d={nom:v("fNom"),type:v("fType"),sexe:r("sexe"),repro:r("repro"),cam:r("cam"),objet:v("fObjet"),gest:v("fGest")};
  const L=getParcs();
  // même nom de guilde → on ajoute au parc existant
  let p=L.find(x=>x.guilde.toLowerCase()===guilde.toLowerCase());
  if(!p){p={id:Date.now().toString(36),guilde,dragos:[]};L.push(p);}
  for(let i=0;i<nb;i++)p.dragos.push({...d});
  Store.set("parcs",L); closeForm();
});

// ================= FENÊTRE DE CONFIRMATION =================
// Règle de l'appli : toute modification, réinitialisation ou suppression passe par
// cette fenêtre, avec un récapitulatif de ce qui va se passer.
function confirmBox({titre,lignes=[],avert="",ok="Valider",danger=false}){
  return new Promise(res=>{
    const root=document.getElementById("modalRoot");
    root.innerHTML=`<div class="modal"><div class="box"><h3>${titre}</h3>
      <p style="margin:0">En validant :</p><ul>${lignes.map(l=>`<li>${l}</li>`).join("")}</ul>
      ${avert?`<p class="warn">${avert}</p>`:""}
      <div class="formBtns"><button class="btn ghost" data-r="0">Annuler</button><button class="btn ${danger?"danger":""}" data-r="1">${ok}</button></div></div></div>`;
    root.querySelector(".modal").onclick=e=>{const b=e.target.closest("[data-r]");if(b||e.target.classList.contains("modal")){root.innerHTML="";res(b?.dataset.r==="1");}};
  });
}
const lib={sexe:v=>v==="M"?"Mâle":"Femelle",repro:v=>v==="oui"?"Oui":"Non",cam:v=>v==="oui"?"Oui":"Non"};
const CHAMPS=[["nom","Nom"],["type","Type"],["sexe","Sexe"],["repro","Reproductrice"],["cam","Caméléone"],["objet","Objet à la vente"],["gest","Gestation"]];
const pl=(n,un,plusieurs)=>n>1?plusieurs.replace("#",n):un.replace("#",n);
const val=(k,v)=>lib[k]?lib[k](v):(v||"—");
function saveParc(p){const L=getParcs();const i=L.findIndex(x=>x.id===p.id);if(i>=0)L[i]=p;Store.set("parcs",L);}
const parcCourant=()=>getParcs().find(x=>x.id===curParc);

// Modifier une dragodinde (une ligne)
function editDrago(i){
  const p=parcCourant(), d=p.dragos[i], root=document.getElementById("modalRoot");
  const radio=(n,a,b,la,lb)=>`<div class="choice"><label><input type="radio" name="e_${n}" value="${a}" ${d[n]===a?"checked":""}> ${la}</label><label><input type="radio" name="e_${n}" value="${b}" ${d[n]===b?"checked":""}> ${lb}</label></div>`;
  const lab=t=>`<span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">${t}</span>`;
  root.innerHTML=`<div class="modal"><div class="box"><h3>✏️ Modifier la ligne ${i+1}</h3><form id="editForm" class="f" autocomplete="off">
    <div class="f">${lab("Nom de la dragodinde")}<input type="text" id="e_nom" value="${esc(d.nom)}" required></div>
    <div class="f">${lab("Type de la dragodinde")}<input type="text" id="e_type" value="${esc(d.type)}" required></div>
    <div class="f">${lab("Sexe")}${radio("sexe","M","F","Mâle","Femelle")}</div>
    <div class="f">${lab("Reproductrice")}${radio("repro","oui","non","Oui","Non")}</div>
    <div class="f">${lab("Caméléone")}${radio("cam","oui","non","Oui","Non")}</div>
    <div class="f">${lab("Objet obtenu à la vente")}<input type="text" id="e_objet" value="${esc(d.objet)}"></div>
    <div class="f">${lab("Temps de gestation")}<input type="text" id="e_gest" value="${esc(d.gest)}"></div>
    <div class="formBtns"><button type="button" class="btn ghost" id="e_cancel">Annuler</button><button type="submit" class="btn">Enregistrer</button></div>
  </form></div></div>`;
  document.getElementById("e_cancel").onclick=()=>root.innerHTML="";
  document.getElementById("editForm").onsubmit=async e=>{
    e.preventDefault();
    const f=e.target, n={...d,nom:f.querySelector("#e_nom").value.trim(),type:f.querySelector("#e_type").value.trim(),
      sexe:f.querySelector("[name=e_sexe]:checked").value,repro:f.querySelector("[name=e_repro]:checked").value,cam:f.querySelector("[name=e_cam]:checked").value,
      objet:f.querySelector("#e_objet").value.trim(),gest:f.querySelector("#e_gest").value.trim()};
    const diffs=CHAMPS.filter(([k])=>(d[k]||"")!==(n[k]||"")).map(([k,l])=>`<b>${l}</b> : ${esc(val(k,d[k]))} → ${esc(val(k,n[k]))}`);
    if(!diffs.length){root.innerHTML="";return;}
    if(await confirmBox({titre:"Confirmer la modification",lignes:[`La ligne ${i+1} (${esc(d.nom)}) du parc <b>${esc(p.guilde)}</b> sera modifiée :`,...diffs],ok:"Enregistrer"})){
      p.dragos[i]=n; saveParc(p); renderParc(p.id);
    }
  };
}
// Supprimer une dragodinde (une ligne)
async function delDrago(i){
  const p=parcCourant(), d=p.dragos[i];
  if(await confirmBox({titre:"Supprimer cette dragodinde ?",danger:true,ok:"Supprimer",
    lignes:[`La ligne ${i+1} sera retirée du parc <b>${esc(p.guilde)}</b> : ${esc(d.nom)} (${esc(d.type)}, ${lib.sexe(d.sexe)}).`,`Le parc passera de ${p.dragos.length} à ${pl(p.dragos.length-1,"# dragodinde","# dragodindes")}.`],
    avert:"Cette action est définitive."})){
    p.dragos.splice(i,1); saveParc(p); renderParc(p.id);
  }
}
document.getElementById("parcBody").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"), de=e.target.closest("[data-del]");
  if(ed)editDrago(+ed.dataset.edit); if(de)delDrago(+de.dataset.del);
});
// Réinitialiser un parc (le vider)
document.getElementById("resetParc").onclick=async()=>{
  const p=parcCourant();
  if(await confirmBox({titre:"Réinitialiser ce parc ?",danger:true,ok:"Réinitialiser",
    lignes:[`${pl(p.dragos.length,"La dragodinde","Les # dragodindes")} du parc <b>${esc(p.guilde)}</b> ${pl(p.dragos.length,"sera retirée","seront retirées")}.`,"Le parc restera dans la liste, vide, prêt à être rempli de nouveau."],
    avert:"Cette action est définitive."})){
    p.dragos=[]; saveParc(p); renderParc(p.id);
  }
};
// Supprimer un parc
document.getElementById("delParc").onclick=async()=>{
  const p=parcCourant();
  if(await confirmBox({titre:"Supprimer ce parc ?",danger:true,ok:"Supprimer",
    lignes:[`Le parc <b>${esc(p.guilde)}</b> disparaîtra de la Gestion des parcs.`,p.dragos.length?`${pl(p.dragos.length,"Sa dragodinde sera supprimée","Ses # dragodindes seront supprimées")} avec lui.`:"Il est déjà vide."],
    avert:"Cette action est définitive."})){
    Store.set("parcs",getParcs().filter(x=>x.id!==p.id)); depth=Math.max(0,depth-1); location.replace("#parcs");
  }
};
// Tout réinitialiser
document.getElementById("resetAll").onclick=async()=>{
  const L=getParcs(), n=L.reduce((a,p)=>a+p.dragos.length,0);
  if(await confirmBox({titre:"Réinitialiser tous les parcs ?",danger:true,ok:"Tout réinitialiser",
    lignes:[`${pl(L.length,"Le parc sera supprimé","Les # parcs seront supprimés")} : ${L.map(p=>"<b>"+esc(p.guilde)+"</b>").join(", ")}.`,`Au total, ${pl(n,"# dragodinde sera effacée","# dragodindes seront effacées")}.`,"La Gestion des parcs repartira de zéro."],
    avert:"Cette action est définitive."})){
    Store.set("parcs",[]); renderParcs();
  }
};

// Onglet Mises à jour : liste + pastille rouge s'il y a du nouveau depuis la dernière visite
document.getElementById("newsList").innerHTML=MAJ.map(m=>
  `<div class="card maj"><h3>Version ${m.v}<small>${m.d}</small></h3><ul>${m.t.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("");
const lastSeen=Store.get("majVue",0);
document.getElementById("newsDot").hidden=!(MAJ[0].v>lastSeen);
addEventListener("hashchange",()=>{if(location.hash==="#news"){Store.set("majVue",MAJ[0].v);document.getElementById("newsDot").hidden=true}});
if(location.hash==="#news")Store.set("majVue",MAJ[0].v);

// Bouton ⟳ : vide le cache de CETTE appli (préfixe "drago-") et recharge la dernière version.
// Les caches des autres applis (Quiz Master Quest…) ne sont pas touchés.
document.getElementById("refresh").addEventListener("click",function(){
  this.classList.add("spin");
  const go=()=>location.replace(location.pathname+"?v="+Date.now());
  const t=setTimeout(go,4000);
  Promise.all([
    "serviceWorker"in navigator?navigator.serviceWorker.getRegistrations().then(r=>Promise.all(r.filter(x=>x.scope.includes("/drago-gestion/")||!x.scope.includes("github.io")).map(x=>x.unregister()))).catch(()=>{}):0,
    window.caches?caches.keys().then(k=>Promise.all(k.filter(x=>x.startsWith("drago-")).map(x=>caches.delete(x)))).catch(()=>{}):0
  ]).then(()=>{clearTimeout(t);go()});
});

show(); // affichage de la page de départ, une fois tout le reste prêt
</script>
