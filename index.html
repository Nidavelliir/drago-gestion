<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Drago Gestion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drago Gestion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=19">
<link rel="apple-touch-icon" href="icon-maskable-192.png?v=19">
<style>
:root{
  --bg:#1f3d24; --bg2:#14291a; --gold:#ffc23a; --gold2:#e8891c; --ink:#2a1a08; --txt:#fbeecb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;color:var(--txt);
  background:var(--bg) url("fond.webp") center top/cover no-repeat fixed;
  min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.page{display:none;min-height:100dvh;padding:20px 16px 32px;max-width:640px;margin:0 auto}
.page.on{display:flex;flex-direction:column}


/* ---- Accueil ---- */
#home{justify-content:center;gap:10px}
#refresh{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:5;width:64px;border:0;background:none;padding:0;cursor:pointer}
#refresh img,#newsBtn img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
#refresh:active{transform:scale(.92)}
#refresh.spin img{animation:spin .8s linear infinite}
#newsBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:8px;z-index:5;width:150px;border:0;background:none;padding:0;cursor:pointer}
#newsBtn:active{transform:scale(.94)}
#newsDot{display:none}
.maj{margin-bottom:14px}
.maj h3{margin:0 0 6px;color:var(--gold);font-size:17px}
.maj h3 small{color:var(--txt);opacity:.7;font-weight:400;font-size:13px;margin-left:6px}
.maj ul{margin:0;padding-left:20px;line-height:1.45}
@keyframes spin{to{transform:rotate(360deg)}}
.tile{border:0;background:none;padding:0;cursor:pointer;display:block;width:100%;
  transition:transform .12s ease,filter .12s ease}
.tile:active{transform:scale(.95);filter:brightness(1.12)}
.tile img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}

/* bouton provisoire en attendant les visuels */
.plate{
  aspect-ratio:1.5/1;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(#ffd45c,var(--gold2));border:4px solid #3a2208;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.45);
}
.plate span{background:#1a1208;color:#ffe08a;font-weight:800;font-size:clamp(11px,3.4vw,17px);max-width:92%;overflow-wrap:anywhere;
  padding:7px 8px;border-radius:10px;border:2px solid var(--gold);letter-spacing:0;text-transform:uppercase}

/* ---- Pages internes ---- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{border:3px solid #3a2208;border-radius:14px;background:linear-gradient(#ffd45c,var(--gold2));
  color:var(--ink);font-weight:800;font-size:22px;width:48px;height:48px;cursor:pointer;flex:none}
.back:active{transform:scale(.92)}
.top h2{margin:0;color:var(--gold);font-size:26px;text-shadow:0 2px 0 #7a3d06,0 0 10px rgba(0,0,0,.9),0 0 3px #000}
.card{background:rgba(22,30,14,.82);border:2px solid rgba(255,194,58,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:18px;padding:18px;line-height:1.45}
.card b{color:var(--gold)}
.muted{opacity:.75;font-size:14px}

/* ---- Gestion des parcs ---- */
.btn{display:block;width:100%;border:3px solid #3a2208;border-radius:16px;cursor:pointer;padding:14px 16px;
  background:linear-gradient(#ffd45c,var(--gold2));color:var(--ink);font-size:18px;font-weight:800;font-family:inherit;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 12px rgba(0,0,0,.45)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(22,30,14,.85);color:var(--txt);border-color:rgba(255,194,58,.6)}
.parcList{display:flex;flex-direction:column;gap:12px;margin-top:16px}
/* boutons image */
.imgBtn,.back.imgBack{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;height:auto;border-radius:0}
.imgBtn img,.imgBack img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.imgBtn:active,.imgBack:active{transform:scale(.97)}
.back.imgBack{margin:0 0 12px}
.imgBack img{width:100%}
/* plaque d'un parc (nom de guilde + nombre de dragodindes) */
.btn.parcBtn{position:relative;display:flex;align-items:center;gap:2%;width:100%;aspect-ratio:1100/181;padding:0 6% 0 18.5%;
  background:url("plaque_parc.webp") center/100% 100% no-repeat;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));
  font-family:inherit;text-align:left;cursor:pointer}
.parcBtn .nomG{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.08;overflow-wrap:anywhere;font-size:clamp(13px,4.1vw,22px);font-weight:900;color:#fff2b8;
  text-shadow:0 2px 0 #4a2306,0 0 3px #3a1a04,1px 1px 0 #3a1a04,-1px -1px 0 #3a1a04}
.parcBtn .sep{width:2px;align-self:stretch;margin:5.5% 0;background:#f5b72a;border-radius:2px;flex:none}
.parcBtn .plume{height:44%;width:auto;flex:none}
.parcBtn .nbG{flex:none;font-size:clamp(10px,3vw,15px);font-weight:800;color:#fff2b8;white-space:nowrap;text-shadow:0 2px 0 #4a2306,1px 1px 0 #3a1a04,-1px -1px 0 #3a1a04}
.parcBtn:active{transform:scale(.97)}
.oldParcBtn{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:20px;
  background:linear-gradient(#2b1d0c,#1a1208);color:#ffe08a;border:3px solid var(--gold)}
.parcBtn small{font-size:13px;font-weight:600;color:var(--txt);opacity:.8}
form.card{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.f label.t{display:block;font-weight:700;color:var(--gold);margin-bottom:5px;font-size:15px}
.f input[type=text],.f input[type=number]{width:100%;padding:11px 12px;border-radius:10px;border:2px solid rgba(255,194,58,.5);
  background:rgba(255,248,225,.95);color:#2a1a08;font-size:16px;font-family:inherit}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer;
  border:2px solid rgba(255,194,58,.5);background:rgba(255,255,255,.06);font-weight:700}
.choice input{accent-color:var(--gold2);width:18px;height:18px;margin:0}
.choice label:has(input:checked){background:rgba(255,194,58,.28);border-color:var(--gold)}
.formBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.empty{text-align:center}
.tableWrap{overflow-x:auto;border-radius:16px;border:2px solid rgba(255,194,58,.6);background:rgba(22,30,14,.88)}
table.dragos{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.dragos th{background:#1a1208;color:var(--gold);text-align:left;padding:10px;position:sticky;top:0}
.dragos td{padding:10px;border-top:1px solid rgba(255,194,58,.25)}
.dragos tr:nth-child(even) td{background:rgba(255,255,255,.04)}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-weight:700;font-size:12px}
.tag.m{background:#2f6fd6;color:#fff}.tag.f{background:#e0479e;color:#fff}
.tag.oui{background:#3d9a4a;color:#fff}.tag.non{background:rgba(255,255,255,.15)}
.act{display:flex;gap:6px}
.ico{width:36px;height:36px;border-radius:10px;border:2px solid rgba(255,194,58,.6);background:rgba(255,255,255,.08);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ico:active{transform:scale(.9)}
.ico.del{border-color:rgba(226,59,46,.7)}
.ico:has(img){border:0;background:none;width:42px;height:40px}
.ico img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.btn.danger{background:linear-gradient(#ff6b5e,#c4271c);color:#fff;border-color:#5a0d07}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tools .btn{font-size:15px;padding:12px 10px}
/* fenêtres (modales) */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:#1c2412;border:3px solid var(--gold);border-radius:20px;padding:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal h3{margin:0 0 10px;color:var(--gold);font-size:20px}
.modal ul{margin:6px 0 12px;padding-left:20px;line-height:1.5}
.modal .warn{background:rgba(226,59,46,.18);border:1px solid rgba(226,59,46,.6);border-radius:10px;padding:8px 10px;font-size:14px}
.modal .box form{display:flex;flex-direction:column;gap:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
/* bandeau titre avec nom de guilde */
.back.hdrG{position:relative;display:block;width:100%;height:auto;border:0;background:none;padding:0;border-radius:0;margin:0 0 12px;cursor:pointer}
.hdrG img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.hdrG .hdrTxt{position:absolute;left:22%;right:6.5%;top:39%;height:33%;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(15px,5.2vw,28px);font-weight:900;color:#ffe9a8;line-height:1.05;overflow:hidden;
  text-shadow:0 2px 0 #5a2c06,1px 1px 0 #3a1a04,-1px -1px 0 #3a1a04,0 0 10px rgba(255,170,40,.6)}
.hdrG:active{transform:scale(.97)}
/* cadres mâles / femelles disponibles */
.statImg{position:relative;width:100%}
.statImg img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.statImg .sv{position:absolute;left:35%;right:12%;top:13%;height:57%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.statImg .sv b{font-size:clamp(18px,6vw,30px);font-weight:900}
.statImg .sv span{font-size:clamp(9px,2.7vw,13px);font-weight:800;color:#ffeccc;text-shadow:0 1px 0 #000,0 0 4px #000;margin-top:2px;text-align:center}
.statImg.m .sv b{color:#bfe3ff;text-shadow:0 0 8px #2f8cff,0 2px 0 #062a5a}
.statImg.f .sv b{color:#ffd0ee;text-shadow:0 0 8px #ff3fb4,0 2px 0 #4a0638}
/* ---- Accouchements ---- */
.card.gest{position:relative;padding:14px 14px 12px;margin-bottom:14px;border-radius:22px;border:3px solid #e9b23a;
  background:radial-gradient(ellipse at 50% 0%,#1d4430 0%,#0e2619 70%);box-shadow:inset 0 0 0 2px rgba(120,60,0,.6),inset 0 0 22px rgba(255,190,60,.18),0 8px 18px rgba(0,0,0,.5);backdrop-filter:none}
.gest .who{display:flex;flex-direction:column;gap:4px}
.gest .who>span{display:flex;align-items:center;gap:6px;font-size:16px;padding-bottom:4px;border-bottom:1px solid rgba(233,178,58,.25)}
.gest .who>span:last-child{border:0}
.gest .who b{color:#ffd23a}
.gest .who .tag{padding:3px 8px;font-size:14px;border:2px solid rgba(255,255,255,.35)}
.gest .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.timer{position:relative;display:flex;align-items:center;gap:6px;margin:12px 0 10px;border-radius:18px;padding:6px 10px 6px 4px;
  background:radial-gradient(ellipse at 70% 50%,#5a1d8a 0%,#2a0a4a 75%);border:3px solid #e9b23a;box-shadow:inset 0 0 18px rgba(200,90,255,.35),0 0 12px rgba(255,194,58,.25)}
.timer .oeuf{width:27%;max-width:110px;flex:none}
.timer .txt{flex:1;text-align:center;min-width:0}
.timer .t{font-size:clamp(26px,8vw,40px);font-weight:900;letter-spacing:.5px;color:#ffe14a;font-variant-numeric:tabular-nums;white-space:nowrap;
  text-shadow:0 0 12px rgba(255,200,40,.75),0 2px 0 #7a3d06}
.timer .l{font-size:12px;font-weight:800;color:#fff3d6;text-transform:uppercase;letter-spacing:2.5px}
.timer.pret{background:radial-gradient(ellipse at 30% 50%,#2f7a2a 0%,#0f3a14 75%);box-shadow:inset 0 0 18px rgba(255,220,90,.35),0 0 18px rgba(125,255,138,.45);animation:pulse 1.6s ease-in-out infinite}
.timer.pret .t{font-size:clamp(22px,6.8vw,34px);white-space:normal;line-height:1.05;color:#ffeab0;text-shadow:0 0 12px rgba(255,210,90,.8),0 2px 0 #5a2c06}
.timer.inconnu{background:rgba(0,0,0,.35)}
.timer.inconnu .t{font-size:16px;color:var(--txt);text-shadow:none;white-space:normal}
@keyframes pulse{50%{transform:scale(1.02)}}
.barre{height:16px;border-radius:10px;background:#0c3a3a;border:2px solid #e9b23a;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.barre i{display:block;height:100%;background:linear-gradient(#fff28a,#ffd21a 45%,#e8a10c);border-radius:8px;box-shadow:0 0 8px rgba(255,220,60,.8)}
.gest .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gest .dates span{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;padding:7px 6px;border-radius:999px;border:2px solid #c9921f;background:rgba(0,0,0,.35);white-space:nowrap}
.grpParc{margin:18px 0 10px;font-size:18px;color:#ffe9a8;text-align:center;padding:9px 14px;border-radius:16px;border:3px solid #e9b23a;
  background:linear-gradient(#7a4316,#4a250a);box-shadow:inset 0 2px 0 rgba(255,220,150,.3),0 6px 12px rgba(0,0,0,.45);text-shadow:0 2px 0 #2a1204}
/* ---- Stérilisation ---- */
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:2px solid rgba(255,194,58,.4);background:rgba(255,255,255,.05);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold2);flex:none}
.chk:has(input:checked){background:rgba(255,194,58,.25);border-color:var(--gold)}
.chkList{display:flex;flex-direction:column;gap:6px;max-height:42dvh;overflow:auto;margin:8px 0}
.ster{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px}
.ster .who{flex:1;min-width:0}
/* ---- Accouplements ---- */
.accBtn{display:block;margin:18px auto 6px;width:min(100%,360px);border:0;background:none;padding:0;cursor:pointer}
.accBtn:active{transform:scale(.95)}
.accBtn img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.accBtn .plate{aspect-ratio:3/1;border-radius:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#ffd45c,var(--gold2));border:4px solid #3a2208;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.45)}
.accBtn .plate span{background:#1a1208;color:#ffe08a;font-weight:800;font-size:20px;padding:8px 14px;border-radius:10px;border:2px solid var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{text-align:center;padding:12px 8px}
.stat b{display:block;font-size:26px}
h4.sec{color:var(--gold);margin:22px 0 10px;font-size:18px;text-shadow:0 0 8px #000,0 0 3px #000}
.pair{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:12px 14px}
.pair .who{flex:1;min-width:0}
.pair .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair .who div.when{font-size:13px;opacity:.85;margin-top:4px;white-space:normal}
.ready{color:#7dff8a;font-weight:800}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick h5{margin:0 0 6px;font-size:15px}
.pick .col{display:flex;flex-direction:column;gap:6px}
.opt{display:block;padding:9px 10px;border-radius:10px;border:2px solid rgba(255,194,58,.4);background:rgba(255,255,255,.05);cursor:pointer;font-size:14px;line-height:1.25}
.opt input{display:none}
.opt small{display:block;opacity:.75;font-size:12px}
.opt:has(input:checked){background:rgba(255,194,58,.3);border-color:var(--gold)}
.opt.off{opacity:.4;cursor:not-allowed}
button.combo{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;cursor:pointer;
  padding:11px 12px;border-radius:10px;border:2px solid rgba(255,194,58,.6);background:rgba(255,248,225,.95);color:#2a1a08;font-size:16px;font-family:inherit}
button.combo::after{content:"▾";color:#8a5a12;font-size:18px}
button.combo.vide{color:#7a6a50}
.combo+input{margin-top:8px}
input.cache{position:absolute;opacity:0;height:1px;width:1px;pointer-events:none;margin:0;padding:0;border:0}
#pickRoot .modal{z-index:70}
.pickList{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pickList .opt{font-size:16px;padding:12px 14px;color:var(--txt);font-family:inherit;text-align:left;width:100%}
.pickList .opt b{color:var(--txt)}
.pickList .opt small{margin-top:3px}
.pickList .opt.cur{background:rgba(255,194,58,.3);border-color:var(--gold)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;flex:none;font-size:24px;padding:0}
.stepper input{text-align:center;font-size:20px;font-weight:800}
.dispo{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.done{text-align:center;font-size:18px;margin:6px 0 14px}
.f input[type=datetime-local],.f select{width:100%;padding:11px 12px;border-radius:10px;border:2px solid rgba(255,194,58,.5);background:rgba(255,248,225,.95);color:#2a1a08;font-size:16px;font-family:inherit}
</style>
</head>
<body>

<!-- ============ ACCUEIL ============ -->
<section id="home" class="page">
  <button id="refresh" aria-label="Rafraîchir l'application" title="Chercher la dernière mise à jour"><img src="btn_refresh.webp" alt="⟳"></button>
  <button id="newsBtn" data-go="news" aria-label="Mises à jour"><img id="newsImg" src="btn_maj.webp" alt="Mises à jour"><i id="newsDot" hidden></i></button>
  <button class="tile" data-go="parcs" aria-label="Gestion des parcs">
    <img src="btn_parcs.webp?v=5" alt="Gestion des parcs">
  </button>
  <div class="row">
    <button class="tile" data-go="accouplements" aria-label="Accouplements">
      <img src="btn_accouplement.webp" alt="Accouplements">
    </button>
    <button class="tile" data-go="accouchements" aria-label="Accouchements">
      <img src="btn_accouchement.webp" alt="Accouchements">
    </button>
  </div>
</section>

<!-- ============ GESTION DES PARCS ============ -->
<section id="parcs" class="page">
  <button class="back imgBack" data-go="home" aria-label="Retour – Gestion des parcs"><img src="hdr_parcs.webp" alt="← Gestion des parcs"></button>
  <div class="duo" id="parcActions">
    <button class="imgBtn" id="newParcBtn" aria-label="Créer un parc"><img src="btn_creer_parc.webp" alt="Créer un parc"></button>
    <button class="imgBtn" data-go="steril" aria-label="Stérilisation"><img src="btn_sterilisation.webp" alt="Stérilisation"></button>
  </div>

  <form id="parcForm" class="card" hidden autocomplete="off">
    <div class="f"><label class="t" for="fGuilde">Nom de la guilde</label><input type="text" id="fGuilde" required></div>
    <div class="f"><label class="t" for="fNom">Nom de la dragodinde</label><input type="text" id="fNom" data-dl="nom" required></div>
    <div class="f"><label class="t" for="fType">Type de la dragodinde</label><input type="text" id="fType" data-dl="type" required></div>
    <div class="f"><span class="t" style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Sexe</span>
      <div class="choice"><label><input type="radio" name="sexe" value="M" required> Mâle</label><label><input type="radio" name="sexe" value="F"> Femelle</label></div></div>
    <div class="f"><span class="t" style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Reproductrice</span>
      <div class="choice"><label><input type="radio" name="repro" value="oui" required> Oui</label><label><input type="radio" name="repro" value="non"> Non</label></div></div>
    <div class="f"><span class="t" style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Caméléone</span>
      <div class="choice"><label><input type="radio" name="cam" value="oui" required> Oui</label><label><input type="radio" name="cam" value="non"> Non</label></div></div>

<script>
// Stockage : toutes les clés sont préfixées "drago_" pour ne jamais se mélanger
// avec les autres applis hébergées sur la même adresse GitHub (Quiz Master Quest, belote…).
const Store={
  get(k,d){try{const v=localStorage.getItem("drago_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("drago_"+k,JSON.stringify(v))}catch(e){}}
};

// Navigation entre les pages (le bouton retour du téléphone fonctionne aussi)
const PAGES=["home","parcs","accouplements","accouchements","news","steril"];
let depth=0; // nombre de pages ouvertes depuis l'appli (pour que ← fasse un vrai retour)
function show(){
  const id=location.hash.slice(1);
  let p=PAGES.includes(id)?id:"home";
  if(id.startsWith("parc-")){ if(renderParc(id.slice(5))) p="parc"; else p="parcs"; }
  if(id.startsWith("acc-")){ if(renderAcc(id.slice(4))) p="acc"; else p="accouplements"; }
  if(p==="parcs") renderParcs();
  if(p==="accouplements") renderAccParcs();
  if(p==="accouchements") renderGest();
  if(p==="steril") renderSteril();
  document.querySelectorAll(".page").forEach(s=>s.classList.toggle("on",s.id===p));
  scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");if(!b)return;
  const to=b.dataset.go;
  if(b.classList.contains("back")){ if(depth>0){depth--;history.back();} else location.replace("#"+(to==="home"?"":to)); }
  else { depth++; location.hash=to; }
});
addEventListener("hashchange",show);

// ================= GESTION DES PARCS =================
// Données : drago_parcs = [{id, guilde, dragos:[{nom,type,sexe,repro,cam,objet,gest}]}]
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// chaque dragodinde reçoit un identifiant (utile pour les accouplements)
function getParcs(){
  const L=Store.get("parcs",[]); let ch=false;
  L.forEach(p=>p.dragos.forEach(d=>{if(!d.id){d.id=uid();ch=true;}}));
  if(ch)Store.set("parcs",L); return L;
}
// Accouplements : drago_accs = [{id,parcId,maleId,femId,debut(ms),gestH,gestTxt}]
const getAccs=()=>Store.get("accs",[]);
const setAccs=a=>Store.set("accs",a);
const form=document.getElementById("parcForm");
let curParc=null;
const plaque=(go,nom,info)=>`<button class="btn parcBtn" data-go="${go}"><span class="nomG">${esc(nom)}</span><span class="sep"></span><img class="plume" src="plume.webp" alt=""><span class="nbG">${info}</span></button>`;
function renderParcs(){
  const L=getParcs(), el=document.getElementById("parcList");
  document.getElementById("resetAll").hidden=!L.length;
  el.innerHTML=L.length?L.map(p=>plaque(`parc-${p.id}`,p.guilde,pl(p.dragos.length,"# dragodinde","# dragodindes"))).join("")
    :(form.hidden?`<div class="card empty muted">Aucun parc pour l'instant.</div>`:"");
}
// ---- Tri (affichage seulement : le n° de chaque dragodinde ne change pas) ----
const TRIS=[["","Ordre d'ajout"],["nom","Nom"],["type","Type"],["sexe","Sexe"],["repro","Reproductrice"],["cam","Caméléone"],["objet","Objet à la vente"],["gest","Temps de gestation"]];
const getTri=()=>Store.get("tri",{k:"",dir:1});
function trier(L){
  const {k,dir}=getTri(), A=L.map((d,i)=>({d,i}));
  if(!k) return dir<0?A.reverse():A;
  const cle=d=>k==="gest"?(gestHeures(d.gest)??Infinity):k==="sexe"?(d.sexe==="M"?"Mâle":"Femelle"):k==="repro"||k==="cam"?(d[k]==="oui"?0:1):String(d[k]||"").toLowerCase();
  return A.sort((a,b)=>{const x=cle(a.d),y=cle(b.d);return (x<y?-1:x>y?1:a.i-b.i)*dir;});
}
function renderParc(id){
  const p=getParcs().find(x=>x.id===id); if(!p) return false;
  const t=getTri(), nomTri=TRIS.find(x=>x[0]===t.k)?.[1];
  const si=document.getElementById("sortInfo"); si.hidden=!(t.k||t.dir<0); si.textContent=(t.k||t.dir<0)?`Trié par : ${nomTri} (${t.k==="repro"||t.k==="cam"?(t.dir>0?"Oui d'abord":"Non d'abord"):t.dir>0?"croissant":"décroissant"})`:"";
  curParc=id;
  document.getElementById("parcTitle").textContent=p.guilde;
  const oui=v=>`<span class="tag ${v}">${v==="oui"?"Oui":"Non"}</span>`;
  document.getElementById("parcBody").innerHTML=`<div class="tableWrap"><table class="dragos">
    <thead><tr><th>#</th><th>Actions</th><th>Nom</th><th>Type</th><th>Sexe</th><th>Reproductrice</th><th>Caméléone</th><th>Objet à la vente</th><th>Gestation</th></tr></thead>
    <tbody>${trier(p.dragos).map(({d,i})=>`<tr><td>${i+1}</td>
      <td><div class="act"><button class="ico" data-edit="${i}" aria-label="Modifier"><img src="ico_edit.webp" alt="✏️"></button><button class="ico del" data-del="${i}" aria-label="Supprimer"><img src="ico_del.webp" alt="🗑"></button></div></td>
      <td><b>${esc(d.nom)}</b></td><td>${esc(d.type)}</td>
      <td><span class="tag ${d.sexe==="M"?"m":"f"}">${d.sexe==="M"?"♂ Mâle":"♀ Femelle"}</span></td>
      <td>${oui(d.repro)}</td><td>${oui(d.cam)}</td><td>${esc(d.objet)||"—"}</td><td>${esc(d.gest)||"—"}</td></tr>`).join("")}</tbody></table></div>`
    +(p.dragos.length?"":`<div class="card empty muted">Ce parc est vide.</div>`);
  return true;
}
document.getElementById("newParcBtn").onclick=()=>{form.reset();menus(form);form.hidden=false;document.getElementById("parcActions").hidden=true;renderParcs();document.getElementById("fGuilde").focus();};
function closeForm(){form.hidden=true;document.getElementById("parcActions").hidden=false;renderParcs();}
document.getElementById("cancelParc").onclick=closeForm;
form.addEventListener("submit",e=>{
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim(), r=n=>form.querySelector(`input[name=${n}]:checked`).value;
  const guilde=v("fGuilde"), nb=Math.max(1,Math.min(200,parseInt(v("fNb"))||1));
  const d={nom:v("fNom"),type:v("fType"),sexe:r("sexe"),repro:r("repro"),cam:r("cam"),objet:v("fObjet"),gest:v("fGest")};
  const L=getParcs();
  // même nom de guilde → on ajoute au parc existant
  let p=L.find(x=>x.guilde.toLowerCase()===guilde.toLowerCase());
  if(!p){p={id:Date.now().toString(36),guilde,dragos:[]};L.push(p);}
  for(let i=0;i<nb;i++)p.dragos.push({...d,id:uid()});
  Store.set("parcs",L); closeForm();
});

// ================= MENUS DÉROULANTS =================
// Chaque champ Nom / Type / Objet / Gestation devient un menu déroulant avec les valeurs
// déjà enregistrées dans tous les parcs, plus « ➕ Nouveau… » pour en écrire une autre.
function valeursConnues(k){
  const L=getParcs().flatMap(p=>p.dragos);
  return [...new Set(L.map(d=>(d[k]||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));
}
// Liste de choix dans une fenêtre (même style que les autres fenêtres de l'appli)
function pickList({titre,options,current}){
  return new Promise(res=>{
    const r=document.getElementById("pickRoot");
    r.innerHTML=`<div class="modal"><div class="box"><h3>${titre}</h3><div class="pickList">${options.map((o,i)=>
      `<button type="button" class="opt ${o.disabled?"off":""} ${o.value===current?"cur":""}" data-i="${i}" ${o.disabled?"disabled":""}><b>${o.label}</b>${o.sub?`<small>${o.sub}</small>`:""}</button>`).join("")}</div>
      <button type="button" class="btn ghost" data-x>Fermer</button></div></div>`;
    r.querySelector(".modal").onclick=e=>{
      const b=e.target.closest("[data-i]");
      if(b){r.innerHTML="";res(options[+b.dataset.i].value);}
      else if(e.target.closest("[data-x]")||e.target.classList.contains("modal")){r.innerHTML="";res(null);}
    };
  });
}
function menus(root){
  root.querySelectorAll("input[data-dl]").forEach(inp=>{
    if(inp.dataset.req===undefined)inp.dataset.req=inp.required?"1":"";
    if(inp.previousElementSibling?.classList.contains("combo"))inp.previousElementSibling.remove();
    const vals=valeursConnues(inp.dataset.dl), req=inp.dataset.req==="1";
    inp.required=req; inp.classList.remove("cache");
    if(!vals.length)return;                                   // rien d'enregistré : saisie libre
    const titre=inp.closest(".f")?.querySelector("span,label")?.textContent||"Choisir";
    const btn=document.createElement("button"); btn.type="button"; btn.className="combo";
    inp.before(btn);
    const mode=nouveau=>{inp.classList.toggle("cache",!nouveau);};
    const affiche=()=>{const v=inp.value.trim();btn.textContent=nouveau?"➕ Nouveau…":(v||"— Choisir —");btn.classList.toggle("vide",!v&&!nouveau);};
    let nouveau=!!inp.value.trim()&&!vals.includes(inp.value.trim());
    mode(nouveau); affiche();
    btn.onclick=async()=>{
      const v=await pickList({titre,current:nouveau?"__new":inp.value.trim(),options:[...vals.map(x=>({value:x,label:esc(x)})),{value:"__new",label:"➕ Nouveau…"}]});
      if(v===null)return;
      if(v==="__new"){nouveau=true;inp.value="";mode(true);affiche();inp.focus();}
      else{nouveau=false;inp.value=v;mode(false);affiche();}
    };
  });
}

// ================= FENÊTRE DE CONFIRMATION =================
// Règle de l'appli : toute modification, réinitialisation ou suppression passe par
// cette fenêtre, avec un récapitulatif de ce qui va se passer.
function confirmBox({titre,lignes=[],avert="",ok="Valider",danger=false}){
  return new Promise(res=>{
    const root=document.getElementById("modalRoot");
    root.innerHTML=`<div class="modal"><div class="box"><h3>${titre}</h3>
      <p style="margin:0">En validant :</p><ul>${lignes.map(l=>`<li>${l}</li>`).join("")}</ul>
      ${avert?`<p class="warn">${avert}</p>`:""}
      <div class="formBtns"><button class="btn ghost" data-r="0">Annuler</button><button class="btn ${danger?"danger":""}" data-r="1">${ok}</button></div></div></div>`;
    root.querySelector(".modal").onclick=e=>{const b=e.target.closest("[data-r]");if(b||e.target.classList.contains("modal")){root.innerHTML="";res(b?.dataset.r==="1");}};
  });
}
const lib={sexe:v=>v==="M"?"Mâle":"Femelle",repro:v=>v==="oui"?"Oui":"Non",cam:v=>v==="oui"?"Oui":"Non"};
const CHAMPS=[["nom","Nom"],["type","Type"],["sexe","Sexe"],["repro","Reproductrice"],["cam","Caméléone"],["objet","Objet à la vente"],["gest","Gestation"]];
const pl=(n,un,plusieurs)=>n>1?plusieurs.replace("#",n):un.replace("#",n);
const val=(k,v)=>lib[k]?lib[k](v):(v||"—");
function saveParc(p){const L=getParcs();const i=L.findIndex(x=>x.id===p.id);if(i>=0)L[i]=p;Store.set("parcs",L);}
const parcCourant=()=>getParcs().find(x=>x.id===curParc);

// Modifier une dragodinde (une ligne)
function editDrago(i){
  const p=parcCourant(), d=p.dragos[i], root=document.getElementById("modalRoot");
  const radio=(n,a,b,la,lb)=>`<div class="choice"><label><input type="radio" name="e_${n}" value="${a}" ${d[n]===a?"checked":""}> ${la}</label><label><input type="radio" name="e_${n}" value="${b}" ${d[n]===b?"checked":""}> ${lb}</label></div>`;
  const lab=t=>`<span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">${t}</span>`;
  root.innerHTML=`<div class="modal"><div class="box"><h3>✏️ Modifier la ligne ${i+1}</h3><form id="editForm" class="f" autocomplete="off">
    <div class="f">${lab("Nom de la dragodinde")}<input type="text" id="e_nom" data-dl="nom" value="${esc(d.nom)}" required></div>
    <div class="f">${lab("Type de la dragodinde")}<input type="text" id="e_type" data-dl="type" value="${esc(d.type)}" required></div>
    <div class="f">${lab("Sexe")}${radio("sexe","M","F","Mâle","Femelle")}</div>
    <div class="f">${lab("Reproductrice")}${radio("repro","oui","non","Oui","Non")}</div>
    <div class="f">${lab("Caméléone")}${radio("cam","oui","non","Oui","Non")}</div>
    <div class="f">${lab("Objet obtenu à la vente")}<input type="text" id="e_objet" data-dl="objet" value="${esc(d.objet)}"></div>
    <div class="f">${lab("Temps de gestation")}<input type="text" id="e_gest" data-dl="gest" value="${esc(d.gest)}"></div>
    <div class="formBtns"><button type="button" class="btn ghost" id="e_cancel">Annuler</button><button type="submit" class="btn">Enregistrer</button></div>
  </form></div></div>`;

// Temps de gestation saisi en texte ("48 h", "2 j", "1 j 12 h", "90 min", "48") → heures
function gestHeures(t){
  t=String(t||"").toLowerCase().replace(",",".");
  let h=0,ok=false; const re=/(\d+(?:\.\d+)?)\s*(j|jour|jours|d|h|heure|heures|min|mn|m)?/g; let m;
  while((m=re.exec(t))){ok=true;const n=parseFloat(m[1]),u=m[2]||"h";h+=u.startsWith("j")||u==="d"?n*24:u.startsWith("m")?n/60:n;}
  return ok&&h>0?h:null;
}
const fmtDate=ms=>{const d=new Date(ms);return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});};
function reste(ms){const m=Math.round(ms/60000);if(m<=0)return null;const j=Math.floor(m/1440),h=Math.floor(m%1440/60),mn=m%60;return (j?j+" j ":"")+(h?h+" h ":"")+(!j&&mn?mn+" min":"");}

}

  return p.dragos.map((d,i)=>({d,n:i+1,occ:occ.has(d.id)?1:0,raison:d.repro!=="oui"?"non reproductrice":""}));
}

// Assistant : accouplement par type, avec quantité, puis « Suivant » ou « Terminé »
function typesDispo(p){
  const E=etat(p), T={};
  E.forEach(e=>{const t=(e.d.type||"").trim()||"Sans type";T[t]??={type:t,M:[],F:[]};if(!e.raison)T[t][e.d.sexe==="M"?"M":"F"].push(e.d);});
  const occ=new Set(getAccs().filter(a=>a.parcId===p.id).flatMap(a=>[a.maleId,a.femId])), libre=(a,b)=>(occ.has(a.id)?1:0)-(occ.has(b.id)?1:0);
  Object.values(T).forEach(t=>{t.M.sort(libre);t.F.sort(libre);});
  return Object.values(T).map(t=>({...t,max:Math.min(t.M.length,t.F.length)})).sort((a,b)=>a.type.localeCompare(b.type,"fr"));
}

      <div class="f"><span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Date et heure de l'accouplement</span><input type="datetime-local" id="w_date" value="${toLocalInput(Date.now())}" required></div>
      <div class="formBtns"><button type="button" class="btn ghost" id="w_cancel">${faits.length?"Terminé":"Annuler"}</button><button type="submit" class="btn">Accoupler</button></div></form></div></div>`;
    const nb=document.getElementById("w_nb");
    const maj=()=>{
      const b=document.getElementById("w_type"); b.textContent=`${t.type} — ${pl(t.max,"# couple possible","# couples possibles")}`;
      document.getElementById("w_dispo").innerHTML=dispoHtml(t);
      document.getElementById("w_max").textContent=`(1 à ${t.max})`;
      nb.max=t.max; nb.value=t.max;
    };
    maj();
    document.getElementById("w_type").onclick=async()=>{
      const v=await pickList({titre:"Type de dragodinde",current:t.type,options:T.map(x=>({value:x.type,label:esc(x.type)+(faits.includes(x.type)?" ✅":""),
        sub:`♂ ${x.M.length} ${pl(x.M.length,"mâle dispo","mâles dispo")} · ♀ ${x.F.length} ${pl(x.F.length,"femelle dispo","femelles dispo")} · ${x.max?pl(x.max,"# couple possible","# couples possibles"):"aucun couple possible"}`,disabled:!x.max}))});
      if(v){t=T.find(x=>x.type===v);maj();}
    };
    document.getElementById("w_moins").onclick=()=>{nb.value=Math.max(1,(+nb.value||1)-1);};
    document.getElementById("w_plus").onclick=()=>{nb.value=Math.min(t.max,(+nb.value||0)+1);};
    document.getElementById("w_cancel").onclick=()=>root.innerHTML="";
    document.getElementById("wForm").onsubmit=async e=>{
      e.preventDefault();
      const n=Math.max(1,Math.min(t.max,parseInt(nb.value)||1)), debut=new Date(document.getElementById("w_date").value).getTime()||Date.now();
      const males=t.M.slice(0,n), fems=t.F.slice(0,n); // les libres d'abord (tri dans typesDispo)
      const gests=[...new Set(fems.map(f=>f.gest||""))], g0=gestHeures(fems[0].gest);
      const lignes=[`${pl(n,"# couple","# couples")} de dragodindes <b>${esc(t.type)}</b> ${pl(n,"sera formé","seront formés")} dans le parc <b>${esc(p.guilde)}</b>.`,
        `Mâles : ${males.map(d=>esc(d.nom)).join(", ")}`,`Femelles : ${fems.map(d=>esc(d.nom)).join(", ")}`,
        `Date : ${fmtDate(debut)}.`,
        gests.length===1&&g0?`Naissance prévue le ${fmtDate(debut+g0*3600000)} (gestation de ${esc(gests[0])}).`:gests.length>1?"Naissances calculées selon le temps de gestation de chaque femelle.":"Temps de gestation non reconnu : pas de date de naissance calculée.",
        "Chaque gestation apparaîtra dans Accouchements avec son minuteur."];
      const html=root.innerHTML;
      if(await confirmBox({titre:"Confirmer l'accouplement",lignes,ok:"Accoupler"})){
        const A=getAccs();
        for(let i=0;i<n;i++)A.push({id:uid(),parcId:p.id,maleId:males[i].id,femId:fems[i].id,debut,gestH:gestHeures(fems[i].gest),gestTxt:fems[i].gest});
        setAccs(A); renderAcc(p.id);
        accWizard([...faits,t.type],{type:t.type,n});
      } else formType(t.type);
    };
  }
}

// ================= ACCOUCHEMENTS (gestations en cours) =================
const deux=n=>String(n).padStart(2,"0");
function minuteur(ms){ // "1 j 23:59:58"
  const s=Math.max(0,Math.floor(ms/1000)), j=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), sec=s%60;
  return (j?j+" j ":"")+deux(h)+":"+deux(m)+":"+deux(sec);
}
function renderGest(){
  const L=getParcs(), A=getAccs(), el=document.getElementById("gestList"), now=Date.now();
  document.getElementById("gestReset").hidden=!A.length;
  if(!A.length){el.innerHTML=`<div class="card empty muted">Aucune gestation en cours. Les accouplements validés apparaîtront ici avec leur minuteur.</div>`;return;}
  const fin=a=>a.gestH?a.debut+a.gestH*3600000:Infinity;
  let html="";
  L.forEach(p=>{
    const G=A.filter(a=>a.parcId===p.id).sort((a,b)=>fin(a)-fin(b)); if(!G.length)return;
    const byId=Object.fromEntries(p.dragos.map((d,i)=>[d.id,{...d,n:i+1}]));
    html+=`<h4 class="grpParc">🏡 ${esc(p.guilde)} · ${pl(G.length,"# gestation","# gestations")}</h4>`;
    html+=G.map(a=>{
      const m=byId[a.maleId], f=byId[a.femId], fi=fin(a), reste=fi-now, pct=a.gestH?Math.min(100,Math.max(0,(now-a.debut)/(a.gestH*3600000)*100)):0;
      const tm=!a.gestH?`<div class="timer inconnu"><div class="txt"><div class="t">Temps de gestation non renseigné</div></div></div>`
        :reste<=0?`<div class="timer pret"><img class="oeuf" src="oeuf_dore.webp" alt=""><div class="txt"><div class="t">Prête à accoucher !</div></div></div>`
        :`<div class="timer"><img class="oeuf" src="oeuf_violet.webp" alt=""><div class="txt"><div class="l">✦ Temps restant ✦</div><div class="t" data-fin="${fi}">${minuteur(reste)}</div></div></div>`;
      return `<div class="card gest"><div class="head"><div class="who">
          <span><span class="tag f">♀</span> <b>${esc(f?.nom)}</b> <span class="muted">n°${f?.n} · ${esc(f?.type)}</span></span>
          <span><span class="tag m">♂</span> <b>${esc(m?.nom)}</b> <span class="muted">n°${m?.n} · ${esc(m?.type)}</span></span></div>
          <div class="act"><button class="ico" data-gedit="${a.id}" aria-label="Modifier"><img src="ico_edit.webp" alt="✏️"></button><button class="ico del" data-gdel="${a.id}" aria-label="Annuler"><img src="ico_del.webp" alt="🗑"></button></div></div>
        ${tm}${a.gestH?`<div class="barre"><i style="width:${pct.toFixed(1)}%"></i></div>`:""}
        <div class="dates"><span>📅 Début : ${fmtDate(a.debut)}</span><span>🏁 ${a.gestH?"Fin : "+fmtDate(fi):"Gestation : "+(esc(a.gestTxt)||"—")}</span></div></div>`;
    }).join("");
  });
  el.innerHTML=html;
}

// ================= STÉRILISATION =================
// Registre : drago_steriles = [{...dragodinde, parcId, guilde, date}]
const getSter=()=>Store.get("steriles",[]), setSter=v=>Store.set("steriles",v);
function renderSteril(){
  const L=getParcs(), S=getSter();
  document.getElementById("sterParcList").innerHTML=L.length?L.map(p=>`<button class="btn parcBtn" data-ster="${p.id}"><span class="nomG">${esc(p.guilde)}</span><span class="sep"></span><img class="plume" src="plume.webp" alt=""><span class="nbG">${pl(p.dragos.length,"# dragodinde","# dragodindes")}</span></button>`).join("")
    :`<div class="card empty muted">Aucun parc pour l'instant.</div>`;
  document.getElementById("sterReset").hidden=!S.length;
  const el=document.getElementById("sterList");
  if(!S.length){el.innerHTML=`<div class="card empty muted">Aucune dragodinde stérile enregistrée.</div>`;return;}
  const grp={}; S.forEach((d,i)=>{(grp[d.guilde]??=[]).push({d,i});});
  el.innerHTML=Object.entries(grp).map(([g,arr])=>`<h4 class="grpParc">🏡 ${esc(g)} · ${pl(arr.length,"# stérile","# stériles")}</h4>`+arr.map(({d,i})=>
    `<div class="card ster"><div class="who"><div><span class="tag ${d.sexe==="M"?"m":"f"}">${d.sexe==="M"?"♂":"♀"}</span> <b>${esc(d.nom)}</b> <span class="muted">${esc(d.type)}</span></div>
      <div class="muted" style="font-size:12.5px;margin-top:3px">Stérile depuis le ${fmtDate(d.date)}${d.cam==="oui"?" · caméléone":""}${d.objet?" · objet : "+esc(d.objet):""}</div></div>
      <div class="act"><button class="ico" data-srest="${i}" aria-label="Remettre dans le parc">↩️</button><button class="ico del" data-sdel="${i}" aria-label="Supprimer"><img src="ico_del.webp" alt="🗑"></button></div></div>`).join("")).join("");
}
document.getElementById("sterParcList").addEventListener("click",e=>{const b=e.target.closest("[data-ster]");if(b)sterWizard(b.dataset.ster);});
function sterWizard(parcId,dernier=null){
  const root=document.getElementById("modalRoot"), p=getParcs().find(x=>x.id===parcId);
  const T={}; p.dragos.forEach((d,i)=>{const t=(d.type||"").trim()||"Sans type";(T[t]??=[]).push({d,n:i+1});});
  const types=Object.keys(T).sort((a,b)=>a.localeCompare(b,"fr"));
  const fin=dernier?`<p class="done">✅ ${pl(dernier.n,"# dragodinde classée stérile","# dragodindes classées stériles")} (${esc(dernier.type)}).</p>`:"";
  if(!types.length){
    root.innerHTML=`<div class="modal"><div class="box"><h3>✂️ Stérilisation – ${esc(p.guilde)}</h3>${fin}<p>${dernier?"Le parc est maintenant vide.":"Ce parc ne contient aucune dragodinde."}</p><button class="btn" id="s_end">${dernier?"Terminé":"Compris"}</button></div></div>`;
    document.getElementById("s_end").onclick=()=>{root.innerHTML="";renderSteril();}; return;
  }
  if(dernier){
    root.innerHTML=`<div class="modal"><div class="box"><h3>✂️ Stérilisation – ${esc(p.guilde)}</h3>${fin}
      <div class="formBtns"><button class="btn ghost" id="s_end">Terminé</button><button class="btn" id="s_next">Suivant ➜</button></div></div></div>`;
    document.getElementById("s_end").onclick=()=>{root.innerHTML="";renderSteril();};
    document.getElementById("s_next").onclick=()=>form(types[0]); return;
  }
  form(types[0]);
  function form(type){
    const liste=T[type], nM=liste.filter(x=>x.d.sexe==="M").length, nF=liste.length-nM;
    root.innerHTML=`<div class="modal"><div class="box"><h3>✂️ Stérilisation – ${esc(p.guilde)}</h3><form id="sForm">
      <div class="f"><span style="display:block;font-weight:700;color:var(--gold);margin-bottom:5px">Type de dragodinde</span>
        <button type="button" class="combo" id="s_type">${esc(type)}</button>
        <div class="dispo"><span class="tag m">♂ ${pl(nM,"# mâle","# mâles")}</span><span class="tag f">♀ ${pl(nF,"# femelle","# femelles")}</span></div></div>
      <div class="f"><span style="display:block;font-weight:700;color:var(--gold);margin:4px 0 0">Dragodindes à classer stériles</span>
        <div class="formBtns" style="margin-top:6px"><button type="button" class="btn ghost" id="s_all" style="font-size:14px;padding:8px">Tout cocher</button><button type="button" class="btn ghost" id="s_none" style="font-size:14px;padding:8px">Tout décocher</button></div>
        <div class="chkList">${liste.map(({d,n})=>`<label class="chk"><input type="checkbox" value="${d.id}"><span><span class="tag ${d.sexe==="M"?"m":"f"}">${d.sexe==="M"?"♂":"♀"}</span> <b>${esc(d.nom)}</b> <span class="muted">n°${n}${d.repro==="oui"?" · reproductrice":""}${d.cam==="oui"?" · caméléone":""}</span></span></label>`).join("")}</div></div>
      <div class="formBtns"><button type="button" class="btn ghost" id="s_cancel">Annuler</button><button type="submit" class="btn">Valider</button></div></form></div></div>`;
    document.getElementById("s_type").onclick=async()=>{
      const v=await pickList({titre:"Type de dragodinde",current:type,options:types.map(t=>{const m=T[t].filter(x=>x.d.sexe==="M").length;return {value:t,label:esc(t),sub:`♂ ${pl(m,"# mâle","# mâles")} · ♀ ${pl(T[t].length-m,"# femelle","# femelles")}`};})});
      if(v)form(v);
    };
    const boxes=()=>[...root.querySelectorAll(".chkList input")];
    document.getElementById("s_all").onclick=()=>boxes().forEach(b=>b.checked=true);
    document.getElementById("s_none").onclick=()=>boxes().forEach(b=>b.checked=false);
    document.getElementById("s_cancel").onclick=()=>{root.innerHTML="";renderSteril();};
    document.getElementById("sForm").onsubmit=async e=>{
      e.preventDefault();
      const ids=boxes().filter(b=>b.checked).map(b=>b.value);
      if(!ids.length){alertBox("Coche au moins une dragodinde.");return;}
      const choisies=liste.filter(x=>ids.includes(x.d.id)), lies=getAccs().filter(a=>ids.includes(a.maleId)||ids.includes(a.femId)).length;
      const ok=await confirmBox({titre:"Confirmer la stérilisation",ok:"Classer stériles",danger:true,lignes:[
        `${pl(ids.length,"# dragodinde","# dragodindes")} <b>${esc(type)}</b> ${pl(ids.length,"sera classée stérile","seront classées stériles")} : ${choisies.map(x=>esc(x.d.nom)+" (n°"+x.n+")").join(", ")}.`,
        `${pl(ids.length,"Elle sera retirée","Elles seront retirées")} du parc <b>${esc(p.guilde)}</b> et ${pl(ids.length,"inscrite","inscrites")} dans le registre des stériles.`,
        ...(lies?[`${pl(lies,"# accouplement/gestation lié sera annulé","# accouplements/gestations liés seront annulés")}.`]:[]),
        `Tu pourras ${pl(ids.length,"la","les")} remettre dans le parc depuis le registre (↩️).`]});
      if(!ok){form(type);return;}
      const L=getParcs(), q=L.find(x=>x.id===p.id), now=Date.now();
      setSter([...getSter(),...q.dragos.filter(d=>ids.includes(d.id)).map(d=>({...d,parcId:q.id,guilde:q.guilde,date:now}))]);
      q.dragos=q.dragos.filter(d=>!ids.includes(d.id)); Store.set("parcs",L);
      setAccs(getAccs().filter(a=>!ids.includes(a.maleId)&&!ids.includes(a.femId)));
      renderSteril(); sterWizard(p.id,{type,n:ids.length});
    };
  }
}
document.getElementById("sterList").addEventListener("click",async e=>{
  const r=e.target.closest("[data-srest]"), d=e.target.closest("[data-sdel]"); if(!r&&!d)return;
  const S=getSter(), i=+(r||d).dataset[r?"srest":"sdel"], x=S[i]; if(!x)return;
  if(r){
    const L=getParcs(); let q=L.find(p=>p.id===x.parcId)||L.find(p=>p.guilde.toLowerCase()===x.guilde.toLowerCase());
    if(!await confirmBox({titre:"Remettre dans le parc ?",ok:"Remettre",lignes:[`<b>${esc(x.nom)}</b> (${esc(x.type)}, ${lib.sexe(x.sexe)}) ne sera plus classée stérile.`,
      q?`Elle sera remise dans le parc <b>${esc(q.guilde)}</b>.`:`Le parc <b>${esc(x.guilde)}</b> n'existe plus : il sera recréé.`]}))return;
    if(!q){q={id:uid(),guilde:x.guilde,dragos:[]};L.push(q);}
    const {parcId,guilde,date,...dr}=x; q.dragos.push(dr); Store.set("parcs",L);
    S.splice(i,1); setSter(S); renderSteril();
  } else {
    if(!await confirmBox({titre:"Supprimer du registre ?",danger:true,ok:"Supprimer",lignes:[`<b>${esc(x.nom)}</b> (${esc(x.type)}, ${lib.sexe(x.sexe)}, parc ${esc(x.guilde)}) sera effacée du registre des stériles.`],avert:"Cette action est définitive."}))return;
    S.splice(i,1); setSter(S); renderSteril();
  }
});
document.getElementById("sterReset").onclick=async()=>{
  const n=getSter().length;
  if(await confirmBox({titre:"Vider le registre des stériles ?",danger:true,ok:"Vider",lignes:[`${pl(n,"La dragodinde stérile sera effacée","Les # dragodindes stériles seront effacées")} du registre.`,"Elles ne seront pas remises dans les parcs."],avert:"Cette action est définitive."})){setSter([]);renderSteril();}
};

// Bouton ⟳ : vide le cache de CETTE appli (préfixe "drago-") et recharge la dernière version.
// Les caches des autres applis (Quiz Master Quest…) ne sont pas touchés.
document.getElementById("refresh").addEventListener("click",function(){
  this.classList.add("spin");
  const go=()=>location.replace(location.pathname+"?v="+Date.now());
  const t=setTimeout(go,4000);
  Promise.all([
    "serviceWorker"in navigator?navigator.serviceWorker.getRegistrations().then(r=>Promise.all(r.filter(x=>x.scope.includes("/drago-gestion/")||!x.scope.includes("github.io")).map(x=>x.unregister()))).catch(()=>{}):0,
    window.caches?caches.keys().then(k=>Promise.all(k.filter(x=>x.startsWith("drago-")).map(x=>caches.delete(x)))).catch(()=>{}):0
  ]).then(()=>{clearTimeout(t);go()});
});
